<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成语小达人 · 看解释选成语</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Comic Sans MS",sans-serif;
    background: linear-gradient(160deg,#aee1ff 0%,#d4f3ff 45%,#fff3c4 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px; color:#333; overflow-x:hidden;
  }
  .card {
    background:#fff; width:100%; max-width:560px; border-radius:28px;
    box-shadow:0 12px 40px rgba(60,120,200,.25);
    padding:28px 24px 32px; position:relative; overflow:hidden;
  }
  .deco { position:absolute; font-size:34px; opacity:.35; pointer-events:none; user-select:none; }
  .deco.tl{ top:10px; left:12px; transform:rotate(-15deg); }
  .deco.tr{ top:10px; right:12px; transform:rotate(12deg); }
  .deco.bl{ bottom:8px; left:14px; transform:rotate(8deg); }
  .deco.br{ bottom:8px; right:14px; transform:rotate(-10deg); }

  .title { text-align:center; font-size:30px; font-weight:900; color:#ff6b35; letter-spacing:2px; margin-bottom:6px; text-shadow:2px 2px 0 #ffe0b3; }
  .subtitle { text-align:center; color:#7a8aa0; font-size:15px; margin-bottom:22px; }

  .btn {
    display:block; width:100%; border:none; cursor:pointer;
    font-family:inherit; font-size:19px; font-weight:700;
    padding:15px 18px; border-radius:18px; transition:transform .12s, box-shadow .12s;
  }
  .btn:active { transform:scale(.97); }
  .btn-primary { background:linear-gradient(135deg,#ffb347,#ff7b54); color:#fff; box-shadow:0 6px 0 #e05f3c, 0 10px 18px rgba(255,123,84,.35); }
  .btn-primary:active { box-shadow:0 2px 0 #e05f3c; }

  /* HUD */
  .hud { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .progress-wrap { flex:1; height:14px; background:#eef3f8; border-radius:99px; overflow:hidden; }
  .progress-bar { height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#52d273,#2fbf71); transition:width .4s; }
  .score-chip {
    background:#fff7e6; border:2px solid #ffd591; color:#d48806;
    border-radius:99px; padding:4px 12px; font-weight:800; font-size:14px; white-space:nowrap;
  }

  .q-box {
    background:linear-gradient(160deg,#f0f7ff,#e6f4ff);
    border:3px dashed #91caff; border-radius:20px;
    padding:20px 18px; margin-bottom:18px; min-height:110px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .q-label { font-size:13px; color:#4a90d9; font-weight:700; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
  .q-text { font-size:19px; line-height:1.7; color:#2c3e50; font-weight:600; }
  .read-btn {
    border:2px solid #91caff; background:#fff; border-radius:99px;
    width:38px; height:38px; font-size:18px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .read-btn:hover { background:#e6f4ff; transform:scale(1.08); }
  .read-btn:disabled { opacity:.5; cursor:default; transform:none; }
  .read-btn.speaking { border-color:#2fbf71; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(47,191,113,.35)} 50%{box-shadow:0 0 0 7px rgba(47,191,113,0)} }

  .auto-chip {
    display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    background:#eef7ff; border:2px solid #91caff; color:#4a90d9;
    border-radius:99px; padding:4px 12px; font-weight:800; font-size:14px; white-space:nowrap;
  }
  .auto-chip.off { background:#f2f4f7; border-color:#d0d7e0; color:#98a2b3; }
  .auto-chip input { display:none; }

  .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt {
    border:3px solid #dfe9f5; background:#fbfdff; border-radius:18px;
    padding:16px 10px; font-size:22px; font-weight:800; color:#345; cursor:pointer;
    transition:all .15s; letter-spacing:2px; font-family:inherit;
  }
  .opt:hover:not(:disabled) { border-color:#ffb347; background:#fff8ef; transform:translateY(-2px); }
  .opt:disabled { cursor:default; }
  .opt.correct { border-color:#2fbf71; background:#e9fbef; color:#1d9e57; animation:pop .4s; }
  .opt.wrong { border-color:#ff6b6b; background:#fff0f0; color:#e05252; animation:shake .4s; }
  .opt.dim { opacity:.45; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .feedback {
    margin-top:16px; padding:14px 16px; border-radius:16px; font-size:15px; line-height:1.6;
    display:none;
  }
  .feedback.show { display:block; animation:fadein .3s; }
  .feedback.ok { background:#e9fbef; border:2px solid #2fbf71; color:#1d7a46; }
  .feedback.no { background:#fff3f3; border:2px solid #ff8b8b; color:#b84545; }
  .feedback b { font-size:16px; }
  @keyframes fadein { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

  .next-btn { margin-top:14px; display:none; }
  .next-btn.show { display:block; animation:fadein .3s; }

  /* result */
  .result-emoji { text-align:center; font-size:64px; margin:8px 0; }
  .result-score { text-align:center; font-size:22px; font-weight:800; color:#ff6b35; margin-bottom:4px; }
  .result-msg { text-align:center; color:#7a8aa0; margin-bottom:22px; line-height:1.7; }
  .stars { text-align:center; font-size:34px; letter-spacing:6px; margin-bottom:10px; }

  .hidden { display:none !important; }
  .screen { animation:fadein .35s; }
</style>
</head>
<body>
<div class="card">
  <span class="deco tl">📚</span><span class="deco tr">🎈</span>
  <span class="deco bl">✏️</span><span class="deco br">🌟</span>

  <!-- 开始界面 -->
  <div id="startScreen" class="screen">
    <div class="title">成语小达人</div>
    <div class="subtitle" id="subtitle">读一读解释，选出正确的成语吧！</div>
    <div style="text-align:center;font-size:56px;margin:10px 0 22px;">🐲📝💡</div>
    <button class="btn btn-primary" onclick="startGame()">开始挑战 ▶</button>
  </div>

  <!-- 答题界面 -->
  <div id="gameScreen" class="screen hidden">
    <div class="hud">
      <div class="score-chip">⭐ <span id="score">0</span></div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="score-chip" id="qNum">1/10</div>
      <label class="auto-chip" id="autoChip" title="自动读题开关">
        <input type="checkbox" id="autoRead" checked>🔊 读题
      </label>
    </div>
    <div class="q-box">
      <div class="q-label">
        <span>📖 这个解释说的是哪个成语？</span>
        <button class="read-btn" id="readBtn" onclick="readQuestion()" title="读一遍题目">🔊</button>
      </div>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary next-btn" id="nextBtn" onclick="nextQuestion()">下一题 ▶</button>
  </div>

  <!-- 结算界面 -->
  <div id="endScreen" class="screen hidden">
    <div class="title">挑战结束！</div>
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="stars" id="resultStars">⭐⭐⭐</div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="btn btn-primary" onclick="startGame()">再玩一次 🔁</button>
  </div>
</div>

<script>
const BANK = [
  // 寓言神话
  {a:"画蛇添足", q:"画好了蛇，又给蛇添上脚。比喻做了多余的事，反而把事情弄坏了。", s:"他给作文结尾又加了一大段无关的话，真是画蛇添足。"},
  {a:"亡羊补牢", q:"羊丢了再去修补羊圈。比喻出了问题以后及时补救，还不算晚。", s:"这次没考好没关系，亡羊补牢，现在努力还来得及。"},
  {a:"守株待兔", q:"守着树桩等兔子撞上来。比喻心存侥幸，想不劳而获。", s:"学习不能守株待兔，要主动努力才有收获。"},
  {a:"揠苗助长", q:"把禾苗拔高帮助它生长。比喻违反规律急于求成，反而坏事。", s:"学本领要一步一步来，揠苗助长只会适得其反。"},
  {a:"刻舟求剑", q:"在船上刻记号，等船靠岸再去找落水的剑。比喻办事死板，不知变通。", s:"情况变了办法也要跟着变，不能刻舟求剑。"},
  {a:"坐井观天", q:"坐在井底看天，只有井口那么大。比喻眼界狭小，见识有限。", s:"我们要多读书、多见识，不做坐井观天的人。"},
  {a:"井底之蛙", q:"井底的青蛙只能看到一小块天。比喻见识狭窄的人。", s:"只知道自己班级的事，就像井底之蛙一样眼界狭小。"},
  {a:"杯弓蛇影", q:"把酒杯里弓的影子当成了蛇。比喻疑神疑鬼，自己吓自己。", s:"黑夜里的树影把他吓坏了，真是杯弓蛇影。"},
  {a:"狐假虎威", q:"狐狸借着老虎的威风吓唬百兽。比喻依仗别人的势力欺压人。", s:"他仗着哥哥是班长欺负同学，真是狐假虎威。"},
  {a:"掩耳盗铃", q:"捂住自己的耳朵去偷铃铛。比喻自己欺骗自己。", s:"抄作业还假装是自己写的，这不是掩耳盗铃吗？"},
  {a:"对牛弹琴", q:"对着牛弹奏琴曲。比喻对不懂道理的人讲道理，白费口舌。", s:"跟不讲理的人讲道理，简直是对牛弹琴。"},
  {a:"叶公好龙", q:"叶公满屋子画着龙，真龙一来却吓跑了。比喻表面爱好，实际上并不真爱。", s:"他说最喜欢小狗，真见到了却吓得直躲，真是叶公好龙。"},
  {a:"惊弓之鸟", q:"被弓箭吓怕了的鸟，听到弓弦声就害怕。比喻受过惊吓后遇事就害怕的人。", s:"自从上次摔过跤，他一骑自行车就成了惊弓之鸟。"},
  {a:"自相矛盾", q:"卖矛和盾的人说话前后冲突。比喻自己说话做事互相抵触。", s:"他一会儿说去了一会儿说没去，真是自相矛盾。"},
  {a:"滥竽充数", q:"不会吹竽的人混在乐队里充数。比喻没有真才实学的人混在行家里凑数。", s:"合唱时他从不张嘴出声，只是在滥竽充数。"},
  {a:"画龙点睛", q:"给画好的龙点上眼睛，龙就腾空飞走了。比喻在关键处加上一笔，使内容更加生动传神。", s:"老师在作文末尾加了一句话，起到了画龙点睛的作用。"},
  {a:"买椟还珠", q:"买下漂亮的盒子，却退还了里面的珍珠。比喻没有眼光，取舍不当。", s:"只看包装不看内容，就像买椟还珠一样可笑。"},
  {a:"盲人摸象", q:"几个盲人摸大象，各说各的样子。比喻对事物只了解一部分就下结论。", s:"看问题不能盲人摸象，要全面了解再下结论。"},
  {a:"南辕北辙", q:"想去南方，车子却往北赶。比喻行动和目的正好相反。", s:"想提高成绩却不认真学习，这不是南辕北辙吗？"},
  {a:"郑人买履", q:"买鞋宁可相信尺码也不相信自己的脚。比喻拘泥教条，不知变通。", s:"做事要根据实际情况，不能像郑人买履那样死板。"},
  {a:"鹬蚌相争", q:"鹬和蚌互相钳住谁也不放，被渔夫一起捉走。比喻双方相争，让第三者得利。", s:"你们俩再争下去，只会鹬蚌相争，让别人得利。"},
  {a:"螳螂捕蝉", q:"螳螂一心捕蝉，不知黄雀就在身后。比喻只顾眼前利益，不顾身后祸患。", s:"他只顾着玩游戏，忘了作业还没写，真是螳螂捕蝉，黄雀在后。"},
  {a:"塞翁失马", q:"边塞老人丢了马，后来马带回了好马。比喻坏事在一定条件下可能变成好事。", s:"比赛输了也别难过，塞翁失马，焉知非福。"},
  {a:"愚公移山", q:"愚公带领全家挖山不止，终于感动天神移走大山。比喻做事有毅力，不怕困难。", s:"只要有愚公移山的精神，再大的困难也能克服。"},
  {a:"精卫填海", q:"精卫鸟衔来木石，决心填平大海。比喻意志坚决，不畏艰难。", s:"我们学习要有精卫填海那样坚定的意志。"},
  {a:"夸父逐日", q:"夸父奋力追赶太阳。比喻人有宏大的志向和勇气。", s:"他怀着夸父逐日般的志向，立志探索宇宙的奥秘。"},
  {a:"女娲补天", q:"女娲炼五色石修补苍天。形容改造天地的雄伟气魄和大无畏精神。", s:"女娲补天的故事表现了先民改造自然的勇气。"},
  {a:"后羿射日", q:"后羿射落九个太阳，拯救了百姓。形容为民除害的英雄壮举。", s:"后羿射日的传说歌颂了为民除害的英雄。"},
  {a:"嫦娥奔月", q:"嫦娥吞下仙药飞向月宫。古代神话故事，也指奔向美好的境界。", s:"中秋节的晚上，奶奶给我讲了嫦娥奔月的故事。"},
  {a:"开天辟地", q:"盘古氏开辟天地，才有了世界。比喻有史以来第一次，前所未有。", s:"改革开放以来，中国发生了开天辟地的大变化。"},
  {a:"八仙过海", q:"八位神仙各自施展本领渡过东海。比喻各自拿出本领，互相竞赛。", s:"比赛开始了，同学们八仙过海，各显神通。"},
  {a:"东施效颦", q:"丑女东施学西施皱眉，反而更难看了。比喻胡乱模仿，效果适得其反。", s:"模仿别人要取长补短，不能东施效颦。"},
  {a:"邯郸学步", q:"到邯郸学人走路，没学会反而忘了自己怎么走。比喻模仿别人不成，反丢了原有本领。", s:"学别人不能生搬硬套，否则就会像邯郸学步一样闹笑话。"},
  {a:"朝三暮四", q:"早晨给三个、晚上给四个橡子。比喻反复无常，经常变卦。", s:"他做事总是朝三暮四，让人摸不透。"},
  {a:"打草惊蛇", q:"打草时惊动了草里的蛇。比喻行动不够机密，使对方有了防备。", s:"计划还没定好就到处说，会打草惊蛇的。"},
  {a:"黔驴技穷", q:"贵州的驴子只会踢，本领很快就用完了。比喻有限的一点本领已经用完。", s:"对手已经黔驴技穷，再也想不出新办法了。"},
  // 历史故事
  {a:"纸上谈兵", q:"赵括只会空谈兵法，结果打了大败仗。比喻空谈理论，不能解决实际问题。", s:"光会纸上谈兵不行，还要动手实践。"},
  {a:"负荆请罪", q:"廉颇背着荆条向蔺相如认错。表示主动向对方承认错误，请求责罚。", s:"他知道自己错了，主动负荆请罪，向同学道歉。"},
  {a:"完璧归赵", q:"蔺相如把和氏璧完好无损地从秦国带回赵国。比喻把原物完好地归还主人。", s:"借来的书看完要完璧归赵，按时还给同学。"},
  {a:"三顾茅庐", q:"刘备三次到草庐拜访诸葛亮。比喻真心诚意地一再邀请有才能的人。", s:"为了请到这位教练，校长三顾茅庐，终于打动了他。"},
  {a:"卧薪尝胆", q:"勾践睡柴草、尝苦胆，时刻不忘耻辱。形容刻苦自励，发愤图强。", s:"失败后他卧薪尝胆，刻苦训练，终于夺得冠军。"},
  {a:"破釜沉舟", q:"项羽砸破饭锅、凿沉渡船，与秦军决一死战。比喻下定决心，不留退路。", s:"决赛前，队员们抱着破釜沉舟的决心全力拼搏。"},
  {a:"四面楚歌", q:"项羽被困，四面都传来楚地歌声。比喻陷入孤立无援的困境。", s:"敌人陷入四面楚歌的境地，只好投降。"},
  {a:"草木皆兵", q:"苻坚把山上的草木都当成了敌兵。形容人在惊慌时疑神疑鬼。", s:"半夜一个人走路，风吹草动都让他草木皆兵。"},
  {a:"风声鹤唳", q:"听到风声和鹤叫都以为是追兵来了。形容惊慌失措，自相惊扰。", s:"打了败仗的敌人风声鹤唳，狼狈逃窜。"},
  {a:"望梅止渴", q:"曹操说前面有梅林，士兵想到梅子就不渴了。比喻用空想安慰自己。", s:"光想着奖品却不努力，那只是望梅止渴。"},
  {a:"指鹿为马", q:"赵高指着鹿硬说是马。比喻故意颠倒是非，混淆黑白。", s:"明明错了还不承认，这不是指鹿为马吗？"},
  {a:"约法三章", q:"刘邦与百姓约定三条法令。泛指订立简明的条款，大家共同遵守。", s:"开学第一天，老师就和我们约法三章。"},
  {a:"背水一战", q:"韩信背靠河水列阵，士兵拼死作战取胜。比喻在绝境中决一死战。", s:"这次比赛我们背水一战，一定要赢！"},
  {a:"多多益善", q:"韩信说自己带兵越多越好。形容越多越好。", s:"课外书嘛，当然是多多益善。"},
  {a:"一饭千金", q:"韩信发达后用千金报答当年送他饭吃的老人。比喻重重报答有恩于自己的人。", s:"他发达后一饭千金，报答了当年帮助过他的人。"},
  {a:"胯下之辱", q:"韩信年轻时忍受从别人胯下钻过的羞辱。形容能忍受暂时的屈辱，胸怀大志。", s:"韩信能忍受胯下之辱，最终成就了大业。"},
  {a:"毛遂自荐", q:"毛遂自己推荐自己，跟随平原君出使楚国。比喻自告奋勇，自我推荐。", s:"班会上，他毛遂自荐当上了文艺委员。"},
  {a:"脱颖而出", q:"锥子放进口袋，尖儿立刻露出来。比喻人的才能全部显露出来。", s:"这次作文比赛，小明脱颖而出，获得了一等奖。"},
  {a:"围魏救赵", q:"孙膑围攻魏国都城，解了赵国之围。比喻袭击敌人后方，迫使敌人撤退。", s:"对方主力进攻，我们不如围魏救赵，攻击他的后方。"},
  {a:"退避三舍", q:"晋文公主动后退九十里，兑现诺言。比喻主动让步，避免冲突。", s:"面对不讲理的人，最好的办法是退避三舍。"},
  {a:"一鸣惊人", q:"大鸟不鸣则已，一鸣叫就使人震惊。比喻平时默默无闻，一下子做出惊人成绩。", s:"他平时不声不响，这次考试却一鸣惊人。"},
  {a:"老马识途", q:"老马认识走过的道路。比喻有经验的人对情况熟悉，能起到引导作用。", s:"爷爷对这一带很熟，真是老马识途。"},
  {a:"唇亡齿寒", q:"嘴唇没有了，牙齿就会受冻。比喻关系密切，利害相关。", s:"我们和邻班就像唇亡齿寒，要互相支持。"},
  {a:"按图索骥", q:"照着图上画的样子去寻找好马。比喻按照线索寻找，也比喻办事机械死板。", s:"我们按图索骥，照着地图找到了博物馆。"},
  {a:"班门弄斧", q:"在鲁班门前摆弄斧头。比喻在行家面前卖弄本领，不自量力。", s:"在书法大师面前卖弄，真是班门弄斧。"},
  {a:"江郎才尽", q:"江淹晚年再也写不出好文章。比喻才思减退，本领用完。", s:"作家要坚持学习，否则就会江郎才尽。"},
  {a:"洛阳纸贵", q:"左思的文章人人争着抄写，使洛阳的纸都涨了价。形容著作风行一时，流传很广。", s:"他的新书一出版就洛阳纸贵，到处都买不到。"},
  {a:"入木三分", q:"王羲之写字，墨迹渗入木板三分深。形容书法笔力强劲，也比喻见解议论十分深刻。", s:"这篇文章分析问题入木三分，令人佩服。"},
  {a:"投笔从戎", q:"班超扔掉笔去参加军队。指文人弃文从武，从军报国。", s:"战争年代，许多青年投笔从戎，保家卫国。"},
  {a:"老当益壮", q:"年纪虽老，志气更加豪壮。形容老年人精神旺盛，干劲不减。", s:"王爷爷七十岁了还坚持晨跑，真是老当益壮。"},
  {a:"精忠报国", q:"岳母在岳飞背上刺字，激励他竭尽忠诚，报效国家。", s:"岳飞精忠报国的故事激励着一代又一代人。"},
  {a:"草船借箭", q:"诸葛亮用扎满草人的船，向曹军“借”来十万支箭。比喻运用智谋，凭借他人的力量达到目的。", s:"诸葛亮草船借箭，显示了他的神机妙算。"},
  {a:"七步成诗", q:"曹植在七步之内吟出一首诗。形容才思敏捷，出口成章。", s:"曹植七步成诗，才气令人惊叹。"},
  {a:"煮豆燃萁", q:"烧豆秸煮豆子，豆子在锅里哭泣。比喻兄弟之间互相残害。", s:"兄弟之间要友爱，不能煮豆燃萁。"},
  {a:"刮目相看", q:"分别三天，就要擦亮眼睛重新看待。指别人已有进步，不能再用老眼光看待。", s:"一个暑假不见，他的进步让我刮目相看。"},
  {a:"乐不思蜀", q:"刘禅在洛阳玩得快乐，不想回蜀国了。比喻在新环境中得到乐趣，忘了根本。", s:"他沉迷于游戏，简直到了乐不思蜀的地步。"},
  {a:"鞠躬尽瘁", q:"诸葛亮一生勤勤恳恳，竭尽全力，直到去世。形容为事业奉献全部精力。", s:"周总理一生鞠躬尽瘁，为人民操劳到最后一刻。"},
  {a:"初出茅庐", q:"诸葛亮刚出山就打了胜仗。现比喻刚进入社会或刚参加工作，还缺乏经验。", s:"他虽初出茅庐，做起事来却有模有样。"},
  {a:"单刀赴会", q:"关羽只带一口大刀去赴危险的宴会。泛指一个人冒险赴约，有胆有识。", s:"关羽单刀赴会，表现了过人的胆识。"},
  {a:"请君入瓮", q:"用你整治别人的办法来整治你自己，就像请你钻进瓮里一样。", s:"让他尝尝自己设下的圈套，这叫请君入瓮。"},
  {a:"一字千金", q:"改动一个字就赏赐千金。称赞诗文精妙，价值极高。", s:"这篇文章写得精妙，真是一字千金。"},
  {a:"名落孙山", q:"名字落在孙山的后面。指考试或选拔没有被录取。", s:"这次竞赛他名落孙山，但他并不灰心。"},
  {a:"开卷有益", q:"打开书本读一读，总会有收获。鼓励人们多读书。", s:"开卷有益，我们要养成爱读书的好习惯。"},
  {a:"胸有成竹", q:"画竹子之前，心里已经有了完整的竹子形象。比喻做事之前已有了通盘的考虑和把握。", s:"小明胸有成竹地走上讲台，开始演讲。"},
  {a:"高山流水", q:"伯牙弹琴，钟子期一听就懂。比喻知音难遇，也形容乐曲高妙。", s:"他们俩志趣相投，真是高山流水遇知音。"},
  {a:"管鲍之交", q:"管仲和鲍叔牙之间深厚的友情。形容朋友之间彼此了解、互相信任。", s:"我和同桌的友谊就像管鲍之交，互相信任。"},
  // 勤学苦读
  {a:"闻鸡起舞", q:"祖逖听到鸡叫就起床舞剑练武。比喻有志的人抓紧时间，勤奋努力。", s:"为了练好书法，他每天闻鸡起舞，坚持早起练习。"},
  {a:"凿壁偷光", q:"匡衡凿穿墙壁，借邻居的灯光读书。形容家境贫寒却刻苦学习。", s:"匡衡凿壁偷光的故事告诉我们条件差也要坚持学习。"},
  {a:"囊萤映雪", q:"用口袋装萤火虫、借雪地反光来读书。形容在艰苦条件下勤奋学习。", s:"古人囊萤映雪也要读书，我们更应该珍惜现在的好条件。"},
  {a:"悬梁刺股", q:"把头发拴在房梁上、用锥子刺大腿来防止打瞌睡。形容刻苦学习。", s:"我们不必悬梁刺股，但要学习那种刻苦的精神。"},
  {a:"程门立雪", q:"杨时在雪地里站着等候老师醒来。形容尊敬老师，诚恳求学。", s:"程门立雪的故事告诉我们要尊敬老师。"},
  {a:"手不释卷", q:"手里的书舍不得放下。形容勤奋好学，爱不释手。", s:"他太爱看书了，走到哪里都手不释卷。"},
  {a:"铁杵成针", q:"老婆婆要把铁棒磨成绣花针。比喻只要有毅力，肯下苦功，就能成功。", s:"只要功夫深，铁杵成针，学习也是这个道理。"},
  {a:"韦编三绝", q:"孔子读《周易》，编竹简的皮绳磨断了三次。形容读书勤奋刻苦。", s:"孔子韦编三绝，勤奋读书的精神值得我们学习。"},
  {a:"牛角挂书", q:"李密把书挂在牛角上，边走边读。形容勤奋读书，抓紧一切时间学习。", s:"古人牛角挂书，利用一切时间学习。"},
  // 品质修养
  {a:"大公无私", q:"一心为公，没有私心。形容办事公正，不偏袒任何一方。", s:"班长办事大公无私，同学们都很信任他。"},
  {a:"公而忘私", q:"为了公事而忘记了私事。形容一心为公的高尚品质。", s:"老师为了我们的成长，常常公而忘私，带病上课。"},
  {a:"舍己为人", q:"舍弃自己的利益去帮助别人。形容无私奉献的精神。", s:"雷锋叔叔舍己为人的精神值得我们学习。"},
  {a:"舍己救人", q:"不惜牺牲自己的生命去救别人。形容崇高的献身精神。", s:"那位叔叔舍己救人，跳进了冰冷的河里。"},
  {a:"助人为乐", q:"把帮助别人当作快乐的事。形容乐于助人的好品质。", s:"小红助人为乐，大家都喜欢和她做朋友。"},
  {a:"拾金不昧", q:"捡到钱财不藏起来据为己有。形容诚实不贪财的好品德。", s:"他捡到钱包交给了警察叔叔，真是拾金不昧的好少年。"},
  {a:"见义勇为", q:"看到正义的事情就勇敢地去做。形容有正义感，敢于担当。", s:"我们要学习他见义勇为的精神。"},
  {a:"舍生忘死", q:"不把个人的生死放在心上。形容不顾生命危险。", s:"消防员叔叔舍生忘死，冲进了火场。"},
  {a:"舍生取义", q:"为了正义事业宁可牺牲生命。形容为正义而献身的精神。", s:"文天祥舍生取义的气概令人敬佩。"},
  {a:"大义凛然", q:"一身正气，威严不可侵犯的样子。形容坚持正义、英勇不屈的气概。", s:"面对敌人，他大义凛然，毫不畏惧。"},
  {a:"光明磊落", q:"胸怀坦白，行为正派。形容没有私心，正大光明。", s:"他做事光明磊落，从不偷偷摸摸。"},
  {a:"忠心耿耿", q:"形容非常忠诚，一心一意。", s:"他对工作忠心耿耿，深受大家信赖。"},
  {a:"坚贞不屈", q:"坚守节操，绝不向恶势力屈服。", s:"刘胡兰面对敌人坚贞不屈，英勇就义。"},
  {a:"视死如归", q:"把死看得像回家一样平常。形容不怕牺牲生命。", s:"革命先烈视死如归，用生命换来了今天的幸福。"},
  {a:"宁死不屈", q:"宁愿牺牲生命，也绝不屈服。", s:"他宁死不屈，坚决不泄露秘密。"},
  {a:"不屈不挠", q:"在压力和困难面前不低头、不屈服。形容意志坚强。", s:"遇到困难要不屈不挠，坚持到底。"},
  {a:"百折不挠", q:"无论受到多少挫折都不退缩。形容意志坚强，毅力顽强。", s:"科学家百折不挠，终于实验成功了。"},
  {a:"临危不惧", q:"面对危险一点也不害怕。形容勇敢镇定。", s:"面对危险，他临危不惧，保护了同学。"},
  {a:"勇往直前", q:"勇敢地一直向前进，毫不退缩。", s:"在学习的道路上，我们要勇往直前。"},
  {a:"奋不顾身", q:"奋勇向前，不考虑自己的安危。", s:"他奋不顾身地跳进水里，救起了落水儿童。"},
  {a:"挺身而出", q:"勇敢地站出来。形容在困难面前主动承担责任。", s:"看到有人欺负同学，他挺身而出。"},
  {a:"赴汤蹈火", q:"跳进滚水、踏着烈火也在所不辞。比喻不避艰险，奋不顾身。", s:"为了保卫祖国，战士们愿意赴汤蹈火。"},
  {a:"两袖清风", q:"衣袖里除了清风什么也没有。比喻做官廉洁，不贪不占。", s:"包拯一生两袖清风，深受百姓爱戴。"},
  {a:"刚正不阿", q:"刚强正直，不迎合、不偏袒。形容坚持原则。", s:"海瑞刚正不阿，敢于同坏人坏事作斗争。"},
  {a:"铁面无私", q:"像铁面一样不讲私人情面。形容公正严明，不徇私情。", s:"包公断案铁面无私，人人敬佩。"},
  {a:"平易近人", q:"态度和蔼可亲，使人容易接近。", s:"校长平易近人，同学们都愿意和他说心里话。"},
  {a:"宽宏大量", q:"度量大，能容人，不计较小事。", s:"他宽宏大量，从不为小事斤斤计较。"},
  {a:"严于律己", q:"严格地约束和要求自己。", s:"我们要严于律己，宽以待人。"},
  {a:"虚怀若谷", q:"胸怀像山谷一样空阔。形容十分谦虚，能容纳别人的意见。", s:"真正有学问的人往往虚怀若谷。"},
  {a:"不骄不躁", q:"不骄傲，不急躁。形容态度谦逊，做事踏实。", s:"取得成绩后，我们要不骄不躁，继续努力。"},
  {a:"表里如一", q:"外表和内心完全一致。形容诚实，言行相符。", s:"做人要表里如一，不能当面一套背后一套。"},
  {a:"言行一致", q:"说的和做的完全一样。", s:"诚信的人总是言行一致。"},
  {a:"诚实守信", q:"忠诚老实，遵守信用，说到做到。", s:"诚实守信是做人最基本的品质。"},
  {a:"一诺千金", q:"一个诺言就值千金。形容说话算数，极守信用。", s:"他是个一诺千金的人，说到的一定做到。"},
  {a:"言而有信", q:"说话靠得住，有信用。", s:"我们要做言而有信的好孩子。"},
  {a:"知恩图报", q:"受了别人的恩惠，就想着要报答。", s:"受了别人的帮助要知恩图报。"},
  // 学习态度
  {a:"专心致志", q:"一心一意，集中全部精神。形容做事非常专注。", s:"上课时，同学们专心致志地听老师讲课。"},
  {a:"全神贯注", q:"全部精神集中在一点上。形容注意力高度集中。", s:"他全神贯注地做实验，连下课铃都没听见。"},
  {a:"聚精会神", q:"集中精神，专心致志。形容注意力非常集中。", s:"同学们聚精会神地观看科技表演。"},
  {a:"目不转睛", q:"眼珠子一动不动地盯着看。形容注意力高度集中。", s:"同学们目不转睛地盯着神奇的魔术表演。"},
  {a:"一心一意", q:"只有一个心眼儿，没有别的考虑。形容做事专心。", s:"他一心一意扑在学习上，成绩进步很快。"},
  {a:"废寝忘食", q:"顾不上睡觉，忘记了吃饭。形容非常专心努力。", s:"为了完成科技小制作，他废寝忘食地忙了一整天。"},
  {a:"夜以继日", q:"用夜晚的时间接上白天。形容日夜不停地工作或学习。", s:"科学家们夜以继日地工作，终于取得了突破。"},
  {a:"孜孜不倦", q:"勤奋努力，不知疲倦的样子。", s:"张老师孜孜不倦地教导我们，从不厌倦。"},
  {a:"勤学苦练", q:"勤奋学习，刻苦训练。", s:"运动员们勤学苦练，才能取得好成绩。"},
  {a:"学而不厌", q:"努力学习，从不感到满足。形容好学。", s:"孔子学而不厌的精神值得我们学习。"},
  {a:"不耻下问", q:"不以向地位、学问不如自己的人请教为羞耻。形容虚心好学。", s:"学习中遇到不懂的问题，要不耻下问。"},
  {a:"勤学好问", q:"勤奋学习，喜欢向别人请教。", s:"小明勤学好问，是老师最喜欢的学生。"},
  {a:"博览群书", q:"广泛地阅读各种书籍。形容读书很多，知识丰富。", s:"他博览群书，知识十分丰富。"},
  {a:"学富五车", q:"读过的书能装满五辆车。形容学问渊博。", s:"苏轼学富五车，是宋代著名的文学家。"},
  {a:"博学多才", q:"学问广博，有多方面的才能。", s:"我们的语文老师博学多才，深受大家敬佩。"},
  {a:"温故知新", q:"温习学过的知识，能有新的理解和体会。", s:"复习可以温故知新，别忘了经常回头看一看。"},
  {a:"举一反三", q:"举出一个例子，就能推知其他同类的事。形容善于学习，能够类推。", s:"学数学要学会举一反三，不能死记硬背。"},
  {a:"触类旁通", q:"掌握了某一类知识，就能通晓相关的其他知识。", s:"掌握了方法，就能触类旁通，解决更多问题。"},
  {a:"学以致用", q:"把学到的知识用到实际中去。", s:"学习知识要学以致用，不能只会考试。"},
  {a:"循序渐进", q:"按照一定的次序和步骤逐步深入或提高。", s:"学习要循序渐进，不能急于求成。"},
  {a:"日积月累", q:"一天一天、一月一月地不断积累。形容长时间地积累。", s:"好词好句要日积月累，作文才能写好。"},
  {a:"水滴石穿", q:"水不停地滴，能把石头滴穿。比喻只要有恒心，不断努力，事情就能成功。", s:"只要坚持练习，水滴石穿，字一定能写好。"},
  {a:"绳锯木断", q:"用绳子当锯，也能把木头锯断。比喻力量虽小，坚持下去就能成功。", s:"绳锯木断，坚持就是胜利。"},
  {a:"聚沙成塔", q:"把细沙堆成宝塔。比喻积少成多。", s:"每天记五个单词，聚沙成塔，一年就是一千多个。"},
  {a:"笨鸟先飞", q:"飞得慢的鸟先行动。比喻能力差的人做事要比别人先动手，勤奋努力。", s:"我基础差，就要笨鸟先飞，多花时间学习。"},
  {a:"勤能补拙", q:"勤奋能够弥补天资的不足。", s:"他相信勤能补拙，每天坚持练琴两小时。"},
  {a:"熟能生巧", q:"做得熟练了，就能找到窍门，掌握技巧。", s:"多练习就能熟能生巧，打字越来越快。"},
  {a:"百炼成钢", q:"铁经过反复锤炼才能成为好钢。比喻经过长期锻炼，才能变得坚强、有本领。", s:"只有经过磨炼，才能百炼成钢。"},
  {a:"持之以恒", q:"长久地坚持下去，有恒心。", s:"学习贵在持之以恒，不能三天打鱼两天晒网。"},
  {a:"坚持不懈", q:"坚持到底，一点也不松懈。", s:"他坚持不懈地练习长跑，终于获得了冠军。"},
  {a:"锲而不舍", q:"不停地雕刻，不轻言放弃。比喻有恒心，有毅力。", s:"只要有锲而不舍的精神，就没有克服不了的困难。"},
  {a:"一丝不苟", q:"连最细微的地方也不马虎。形容办事认真细致。", s:"他写作业一丝不苟，从不出错。"},
  {a:"脚踏实地", q:"脚踏在坚实的土地上。比喻做事踏实、认真，不浮夸。", s:"学习要脚踏实地，一步一个脚印。"},
  {a:"埋头苦干", q:"低着头，专心致志地刻苦工作。", s:"科学家们埋头苦干，为国家做出了巨大贡献。"},
  {a:"默默无闻", q:"不出名，不为人知道。形容做事不图名利。", s:"清洁工默默无闻地美化着我们的城市。"},
  {a:"任劳任怨", q:"做事不辞劳苦，也不怕别人埋怨。", s:"妈妈任劳任怨，把家里打理得井井有条。"},
  {a:"勤勤恳恳", q:"勤劳而踏实。形容工作勤奋认真的样子。", s:"他勤勤恳恳地工作，得到了大家的称赞。"},
  {a:"兢兢业业", q:"做事小心谨慎，认真负责，一点不敢懈怠。", s:"老师兢兢业业地教育我们，从不马虎。"},
  // 神态心情
  {a:"兴高采烈", q:"兴致高，情绪热烈。形容非常高兴的样子。", s:"同学们兴高采烈地去春游。"},
  {a:"眉开眼笑", q:"眉头舒展，眼含笑意。形容高兴愉快的样子。", s:"听到这个好消息，奶奶笑得眉开眼笑。"},
  {a:"眉飞色舞", q:"眉毛飞扬，神色喜悦。形容非常得意、兴奋的样子。", s:"讲起旅游的见闻，他眉飞色舞，十分兴奋。"},
  {a:"喜笑颜开", q:"心里高兴，满脸笑容。", s:"丰收了，农民伯伯个个喜笑颜开。"},
  {a:"笑逐颜开", q:"笑得脸都舒展开了。形容满脸笑容，十分高兴。", s:"看到孩子平安归来，妈妈笑逐颜开。"},
  {a:"心花怒放", q:"心里高兴得像花儿盛开一样。形容内心高兴极了。", s:"收到录取通知书，他心花怒放。"},
  {a:"欣喜若狂", q:"高兴得像发了狂一样。形容高兴到了极点。", s:"得知中国队夺冠，球迷们欣喜若狂。"},
  {a:"欢天喜地", q:"形容非常欢喜、高兴的样子。", s:"过年了，家家户户欢天喜地。"},
  {a:"手舞足蹈", q:"高兴得手脚都舞动起来。形容高兴到了极点。", s:"弟弟听到要去动物园，高兴得手舞足蹈。"},
  {a:"捧腹大笑", q:"捧着肚子大笑。形容遇到极可笑的事情。", s:"小品的滑稽动作逗得大家捧腹大笑。"},
  {a:"哄堂大笑", q:"满屋子的人同时大笑起来。", s:"他的口误引得全班哄堂大笑。"},
  {a:"破涕为笑", q:"一下子停止哭泣，露出笑容。", s:"听了妈妈的安慰，妹妹破涕为笑。"},
  {a:"喜出望外", q:"遇到出乎意料的喜事而特别高兴。", s:"收到远方的来信，他喜出望外。"},
  {a:"得意洋洋", q:"形容非常得意、神气十足的样子。", s:"考了一百分，他得意洋洋地向大家炫耀。"},
  {a:"得意忘形", q:"高兴得控制不住自己，失去了常态。", s:"刚取得一点成绩就得意忘形，是要落后的。"},
  {a:"沾沾自喜", q:"自以为很好而得意起来。形容自满的样子。", s:"取得一点成绩就沾沾自喜，不利于进步。"},
  {a:"垂头丧气", q:"低着头，情绪低落。形容因失败或不顺利而灰心失望的样子。", s:"比赛输了，他垂头丧气地走出赛场。"},
  {a:"灰心丧气", q:"因遇到困难或失败而失去信心，意志消沉。", s:"一次失败不要灰心丧气，继续努力就会成功。"},
  {a:"无精打采", q:"没有精神，提不起劲头。形容情绪低落。", s:"他昨晚没睡好，今天无精打采的。"},
  {a:"愁眉苦脸", q:"皱着眉头，哭丧着脸。形容忧愁苦恼的样子。", s:"遇到难题别愁眉苦脸，多动脑筋想办法。"},
  {a:"闷闷不乐", q:"心里烦闷，不快乐。", s:"小明今天闷闷不乐，原来是小狗丢了。"},
  {a:"唉声叹气", q:"因伤感、烦闷而发出叹息声。", s:"遇到挫折不要唉声叹气，要想办法解决。"},
  {a:"泪流满面", q:"眼泪流了满脸。形容非常悲伤。", s:"看到感人的电影片段，她泪流满面。"},
  {a:"痛哭流涕", q:"流着眼泪放声痛哭。形容非常伤心。", s:"听到亲人去世的消息，他痛哭流涕。"},
  {a:"泣不成声", q:"哭得喉咙哽住，发不出声音。形容极度悲伤。", s:"小女孩找不到妈妈，急得泣不成声。"},
  {a:"怒气冲冲", q:"形容非常生气的样子。", s:"他怒气冲冲地走出了房间。"},
  {a:"火冒三丈", q:"形容愤怒到了极点。", s:"看到有人破坏公物，他火冒三丈。"},
  {a:"大发雷霆", q:"比喻大发脾气，高声斥责别人。", s:"这次闯了大祸，爸爸大发雷霆。"},
  {a:"暴跳如雷", q:"又跳又叫，像打雷一样猛烈。形容大怒的样子。", s:"听到这个消息，他气得暴跳如雷。"},
  {a:"气急败坏", q:"上气不接下气，狼狈不堪。形容十分慌张或恼怒的样子。", s:"敌人气急败坏，却又无可奈何。"},
  {a:"咬牙切齿", q:"把牙齿咬得咯咯响。形容极端痛恨的样子。", s:"他对坏人恨得咬牙切齿。"},
  {a:"心惊胆战", q:"心里害怕，胆战心惊。形容非常恐惧。", s:"走过独木桥时，我心惊胆战。"},
  {a:"提心吊胆", q:"心和胆好像悬着。形容十分担心或害怕。", s:"妈妈没回来，我提心吊胆地等了一晚上。"},
  {a:"忐忑不安", q:"心神不定，心里七上八下。", s:"等待公布成绩时，他心里忐忑不安。"},
  {a:"七上八下", q:"形容心里慌乱不安，心神不定。", s:"第一次上台演讲，我心里七上八下。"},
  {a:"惊慌失措", q:"害怕慌张，不知怎么办才好。", s:"遇到火灾不要惊慌失措，要冷静逃生。"},
  {a:"大惊失色", q:"非常吃惊，脸都变了色。形容十分惊恐。", s:"看到蛇，她大惊失色，转身就跑。"},
  {a:"目瞪口呆", q:"瞪大眼睛，说不出话来。形容因吃惊或害怕而发愣的样子。", s:"魔术师精彩的表演让观众目瞪口呆。"},
  {a:"迫不及待", q:"急迫得不能再等待。形容心情十分急切。", s:"放学铃一响，我就迫不及待地冲出教室。"},
  {a:"心急如焚", q:"心里急得像火烧一样。形容非常着急。", s:"孩子走丢了，妈妈心急如焚。"},
  {a:"恍然大悟", q:"一下子完全明白过来。", s:"听了老师的讲解，我恍然大悟。"},
  {a:"茅塞顿开", q:"原来心里像被茅草塞住，忽然被打开了。形容忽然理解、领会。", s:"经老师一点拨，我茅塞顿开，明白了这道题。"},
  {a:"半信半疑", q:"一半相信，一半怀疑。形容对真假不敢肯定。", s:"对这个消息，他半信半疑。"},
  {a:"将信将疑", q:"有点相信，又有点怀疑。", s:"弟弟将信将疑地看着我手中的魔术道具。"},
  {a:"深信不疑", q:"非常相信，没有一点怀疑。", s:"对于他的话，大家深信不疑。"},
  {a:"若有所思", q:"好像在思考着什么的样子。", s:"他望着远方，若有所思。"},
  {a:"心平气和", q:"心里平静，态度温和。指不急躁、不生气。", s:"有矛盾要心平气和地商量解决。"},
  {a:"理直气壮", q:"理由充分，说话就有气势。", s:"他没做错事，说起话来理直气壮。"},
  // 言语说话
  {a:"滔滔不绝", q:"像流水一样连续不断。形容话很多，说起来没完。", s:"一说起足球，他就滔滔不绝。"},
  {a:"口若悬河", q:"说话像河水倾泻一样滔滔不绝。形容能言善辩，口才极好。", s:"辩论会上，他口若悬河，说得对方哑口无言。"},
  {a:"娓娓动听", q:"说话生动婉转，使人爱听。", s:"奶奶讲故事娓娓动听，我们都爱听。"},
  {a:"绘声绘色", q:"叙述、描写得生动逼真，就像亲眼看到、亲耳听到一样。", s:"他把比赛的过程讲得绘声绘色。"},
  {a:"头头是道", q:"形容说话、做事很有条理。", s:"别看他年纪小，说起道理来头头是道。"},
  {a:"夸夸其谈", q:"说话浮夸，不切实际。", s:"做事要踏实，不能只会夸夸其谈。"},
  {a:"喋喋不休", q:"唠唠叨叨，说个没完没了。", s:"他喋喋不休地说了一个多小时。"},
  {a:"吞吞吐吐", q:"想说又不痛痛快快地说。形容说话有顾虑。", s:"他吞吞吐吐地承认了自己的错误。"},
  {a:"一言不发", q:"一句话也不说。", s:"他低着头，一言不发。"},
  {a:"沉默寡言", q:"不爱说笑，很少说话。", s:"他平时沉默寡言，但做事很踏实。"},
  {a:"窃窃私语", q:"背地里小声说话。", s:"上课时不要窃窃私语。"},
  {a:"交头接耳", q:"彼此凑近耳边低声说话。", s:"考试时不能交头接耳。"},
  {a:"豪言壮语", q:"豪迈雄壮、充满英雄气概的话语。", s:"运动员们立下了为国争光的豪言壮语。"},
  {a:"花言巧语", q:"虚假而动听、用来骗人的话。", s:"我们不要相信坏人的花言巧语。"},
  {a:"自言自语", q:"自己跟自己说话。", s:"他一边走路一边自言自语。"},
  {a:"千言万语", q:"许许多多的话。形容想说的话很多。", s:"千言万语汇成一句话：谢谢您，老师！"},
  {a:"三言两语", q:"很少的几句话。形容说话简短。", s:"他三言两语就把事情说清楚了。"},
  {a:"胡言乱语", q:"没有根据地随口乱说。", s:"他发高烧时开始胡言乱语。"},
  {a:"对答如流", q:"回答问题像流水一样顺畅。形容口才好，反应快。", s:"面对记者的提问，他对答如流。"},
  {a:"据理力争", q:"依据道理，竭力争辩，维护自己的观点或权益。", s:"面对错误的做法，我们要敢于据理力争。"},
  // 景色自然
  {a:"山清水秀", q:"山山水水十分清幽秀丽。形容风景优美。", s:"我的家乡山清水秀，是个美丽的地方。"},
  {a:"湖光山色", q:"湖上的风光，山间的景色。形容有山有水，风景秀丽。", s:"西湖的湖光山色吸引了无数游客。"},
  {a:"鸟语花香", q:"鸟儿鸣叫，花儿飘香。形容春天的美好景象。", s:"春天的公园鸟语花香，美丽极了。"},
  {a:"万紫千红", q:"形容百花齐放，色彩艳丽，景象繁荣。", s:"花园里万紫千红，春意浓浓。"},
  {a:"姹紫嫣红", q:"形容各种颜色的花朵娇艳美丽。", s:"春天，公园里姹紫嫣红，美不胜收。"},
  {a:"百花争艳", q:"各种花草竞相开放，争着比美。", s:"春天到了，花园里百花争艳。"},
  {a:"花团锦簇", q:"花朵和锦绣聚集在一起。形容五彩缤纷、十分华丽的样子。", s:"节日的广场花团锦簇，喜气洋洋。"},
  {a:"绿草如茵", q:"绿油油的草像地毯一样柔软。", s:"草原上绿草如茵，像铺了绿色的地毯。"},
  {a:"郁郁葱葱", q:"形容草木苍翠茂盛的样子。", s:"山坡上长满了郁郁葱葱的松树。"},
  {a:"枝繁叶茂", q:"枝叶繁密茂盛。也比喻家族人丁兴旺。", s:"这棵大榕树枝繁叶茂，像一把大伞。"},
  {a:"苍翠欲滴", q:"草木青绿得仿佛要滴下水来。形容草木十分茂盛。", s:"雨后的竹林苍翠欲滴，格外好看。"},
  {a:"春意盎然", q:"春天的意味正浓，到处充满生机。", s:"三月的江南，春意盎然。"},
  {a:"生机勃勃", q:"充满生命力，十分旺盛的样子。", s:"春天的田野到处生机勃勃。"},
  {a:"万物复苏", q:"春天来了，万物都恢复了生机。", s:"春天来了，万物复苏，大地一片生机。"},
  {a:"春暖花开", q:"春天气候温暖，百花盛开。形容美好的春光。", s:"春暖花开的季节，最适合外出踏青。"},
  {a:"草长莺飞", q:"花草生长，黄莺飞舞。形容春天生机勃勃的景色。", s:"江南三月，草长莺飞，景色迷人。"},
  {a:"春光明媚", q:"春天的风光鲜明可爱。", s:"春光明媚的早晨，我们去郊外放风筝。"},
  {a:"烈日炎炎", q:"太阳火辣辣地照射着。形容夏天阳光强烈，天气炎热。", s:"烈日炎炎的夏天，交警叔叔还在指挥交通。"},
  {a:"骄阳似火", q:"强烈的阳光像火一样灼热。", s:"骄阳似火，知了在树上不停地叫。"},
  {a:"倾盆大雨", q:"雨大得像盆里的水直往下倒。形容雨大势急。", s:"刚才还是晴天，转眼间下起了倾盆大雨。"},
  {a:"电闪雷鸣", q:"闪电飞光，雷声轰鸣。形容风雨来势凶猛。", s:"夜晚，窗外电闪雷鸣，下起了暴雨。"},
  {a:"狂风暴雨", q:"猛烈的风，急骤的雨。也比喻声势猛烈或处境险恶。", s:"狂风暴雨过后，天空出现了彩虹。"},
  {a:"秋高气爽", q:"秋天天空晴朗明净，气候凉爽宜人。", s:"秋高气爽的日子，我们去登山。"},
  {a:"天高云淡", q:"天空高远，云彩轻薄。形容秋天晴朗的天空。", s:"秋天，天高云淡，大雁南飞。"},
  {a:"硕果累累", q:"树上结满了又大又多的果实。也比喻取得的成果很多。", s:"果园里硕果累累，丰收在望。"},
  {a:"五谷丰登", q:"各种粮食都获得了丰收。", s:"今年风调雨顺，又是一个五谷丰登的好年景。"},
  {a:"一叶知秋", q:"看见一片落叶，就知道秋天到了。比喻从细微的迹象可以推知事物的发展趋势。", s:"一叶知秋，树叶黄了，秋天就到了。"},
  {a:"落英缤纷", q:"落花繁多而凌乱的样子。形容暮春景色或落花的美景。", s:"春风吹过，公园里落英缤纷。"},
  {a:"冰天雪地", q:"冰雪漫天盖地。形容非常寒冷的景象。", s:"东北的冬天冰天雪地，非常寒冷。"},
  {a:"白雪皑皑", q:"洁白的积雪银光耀眼的样子。", s:"山顶上白雪皑皑，十分壮观。"},
  {a:"银装素裹", q:"大雪覆盖大地，像穿上了白色的盛装。形容雪后美丽的景色。", s:"雪后的校园银装素裹，美丽极了。"},
  {a:"大雪纷飞", q:"雪花大量地飘落。", s:"大雪纷飞的夜晚，路上行人稀少。"},
  {a:"滴水成冰", q:"水滴下去就结成冰。形容天气十分寒冷。", s:"数九寒天，室外滴水成冰。"},
  {a:"崇山峻岭", q:"高大而险峻的山岭。", s:"长城蜿蜒在崇山峻岭之间。"},
  {a:"悬崖峭壁", q:"高耸陡峭的山崖。形容山势险峻。", s:"雄鹰在悬崖峭壁上筑巢。"},
  {a:"连绵起伏", q:"连续不断，高低不平。多形容山丘接连不断。", s:"远处群山连绵起伏，像波浪一样。"},
  {a:"波澜壮阔", q:"水势浩大雄伟。比喻声势雄壮浩大。", s:"波澜壮阔的大海让人心胸开阔。"},
  {a:"波涛汹涌", q:"波浪又大又急地奔涌。形容水势浩大。", s:"海面上波涛汹涌，船只无法出海。"},
  {a:"风平浪静", q:"没有风浪，水面平静。比喻平静无事。", s:"风平浪静的湖面像一面大镜子。"},
  {a:"波光粼粼", q:"水波反射阳光，一闪一闪地发亮。", s:"阳光下，湖水波光粼粼。"},
  {a:"一泻千里", q:"江河奔流直下，又快又远。也比喻文笔气势奔放流畅。", s:"黄河一泻千里，奔向大海。"},
  {a:"飞流直下", q:"水流从高处飞速直泻而下。多形容瀑布的壮观。", s:"瀑布飞流直下，十分壮观。"},
  {a:"碧空如洗", q:"蓝色的天空像洗过一样明净。", s:"雨后的天空碧空如洗。"},
  {a:"万里无云", q:"天空辽阔，没有一丝云彩。形容天气晴朗。", s:"今天万里无云，是个好天气。"},
  {a:"乌云密布", q:"黑云布满了天空。形容大雨来临前的天色。", s:"乌云密布，眼看就要下雨了。"},
  {a:"皓月当空", q:"明亮的月亮挂在天空。", s:"中秋之夜，皓月当空，全家团聚。"},
  {a:"旭日东升", q:"早晨的太阳从东方升起。形容朝气蓬勃的景象。", s:"我们在山顶看旭日东升。"},
  {a:"夕阳西下", q:"傍晚的太阳从西方落下。", s:"夕阳西下，晚霞染红了天空。"},
  {a:"风和日丽", q:"微风和煦，阳光明丽。形容天气晴朗暖和。", s:"风和日丽的早晨，我们去公园游玩。"},
  {a:"云雾缭绕", q:"云和雾环绕着山峰。形容山间景色朦胧美丽。", s:"山顶云雾缭绕，像仙境一样。"},
  {a:"世外桃源", q:"与世隔绝、安乐美好的地方。借指理想中不受外界影响的地方。", s:"这个小山村环境优美，简直就是世外桃源。"},
  {a:"别有洞天", q:"另有一番天地。形容风景奇特，引人入胜。", s:"走进溶洞，里面别有洞天。"},
  // 动物成语
  {a:"龙腾虎跃", q:"像龙在飞腾，像虎在跳跃。形容威武雄壮、非常活跃的姿态。", s:"运动场上，同学们龙腾虎跃，你追我赶。"},
  {a:"龙飞凤舞", q:"像龙飞腾，像凤起舞。形容书法笔势舒展活泼。", s:"他的字写得龙飞凤舞，很有气势。"},
  {a:"龙马精神", q:"像龙马一样健旺的精神。比喻人精神旺盛、奋发向上。", s:"新的一年，祝爷爷奶奶龙马精神，身体健康。"},
  {a:"生龙活虎", q:"像有生气的龙和活力的虎。形容活泼矫健，富有生气。", s:"下课了，同学们生龙活虎地奔向操场。"},
  {a:"卧虎藏龙", q:"隐藏着未被发现的人才。也指隐藏不露的高手。", s:"别小看我们班，真是卧虎藏龙。"},
  {a:"虎头蛇尾", q:"头大得像老虎，尾巴细得像蛇。比喻做事有始无终，不能坚持到底。", s:"做事要有始有终，不能虎头蛇尾。"},
  {a:"骑虎难下", q:"骑在老虎背上不能下来。比喻事情进行中遇到困难，想停也停不了。", s:"事情做到一半才发现错了，真是骑虎难下。"},
  {a:"狼吞虎咽", q:"像狼和虎一样吞咽食物。形容吃东西又猛又急的样子。", s:"弟弟饿极了，狼吞虎咽地吃起来。"},
  {a:"马到成功", q:"战马一到就取得胜利。形容事情顺利，很快就取得成功。", s:"祝你参加比赛马到成功！"},
  {a:"一马当先", q:"一匹马跑在最前面。比喻领先，走在最前面起带头作用。", s:"大扫除时，班长一马当先，干最脏最累的活。"},
  {a:"万马奔腾", q:"成千上万匹马跳跃奔跑。形容声势浩大、进展迅速的热烈场面。", s:"黄河水滚滚而来，犹如万马奔腾。"},
  {a:"汗马功劳", q:"战马奔驰出了汗。指在战场上立下的功劳，现泛指辛勤工作做出的贡献。", s:"这次获奖，指导老师立下了汗马功劳。"},
  {a:"马不停蹄", q:"马不停止地奔跑。比喻一刻也不停留地连续前进。", s:"他马不停蹄地赶到医院看望病人。"},
  {a:"走马观花", q:"骑在奔跑的马上看花。比喻粗略地观察事物，不仔细深入。", s:"参观博物馆不能走马观花，要仔细观看。"},
  {a:"千军万马", q:"形容兵马很多，声势浩大。", s:"解放军以千军万马之势渡过了长江。"},
  {a:"单枪匹马", q:"一个人、一杆枪、一匹马。比喻单独行动，没有别人帮助。", s:"他单枪匹马完成了这项任务。"},
  {a:"鹤立鸡群", q:"仙鹤站在鸡群中间。比喻一个人的才能或仪表在一群人里显得很突出。", s:"在一群孩子中，他的个头显得鹤立鸡群。"},
  {a:"杀鸡儆猴", q:"杀鸡给猴子看。比喻惩罚一个人来警戒其他的人。", s:"老师批评了一个迟到的同学，杀鸡儆猴，大家都守时了。"},
  {a:"鸡犬不宁", q:"连鸡狗都不得安宁。形容骚扰得十分厉害。", s:"弟弟在家里闹得鸡犬不宁。"},
  {a:"狗急跳墙", q:"狗急了能跳墙。比喻走投无路时不顾一切地行动。", s:"不要把坏人逼急了，狗急跳墙就危险了。"},
  {a:"狡兔三窟", q:"狡猾的兔子有三个洞穴。比喻藏身的地方多，便于躲避灾祸。", s:"这个骗子狡兔三窟，警察费了好大劲才抓到他。"},
  {a:"如鱼得水", q:"像鱼得到了水。比喻得到跟自己很投合的人或很适合的环境。", s:"进了游泳队，他如鱼得水，进步飞快。"},
  {a:"鱼目混珠", q:"拿鱼眼睛冒充珍珠。比喻用假的冒充真的，以假乱真。", s:"市场上有些商家以次充好，鱼目混珠。"},
  {a:"浑水摸鱼", q:"趁着水浑浊去摸鱼。比喻趁混乱的时候捞取不正当的利益。", s:"我们不能趁乱浑水摸鱼，占小便宜。"},
  {a:"沉鱼落雁", q:"鱼见了沉入水底，雁见了降落沙洲。形容女子容貌非常美丽。", s:"画中的女子有沉鱼落雁之貌。"},
  {a:"一石二鸟", q:"扔一块石头打中两只鸟。比喻做一件事达到两个目的。", s:"这样既锻炼又环保，真是一石二鸟。"},
  {a:"鹏程万里", q:"大鹏鸟一飞就是万里。比喻前程远大。", s:"祝你毕业后鹏程万里，前程似锦。"},
  {a:"鸦雀无声", q:"连乌鸦、麻雀的声音都没有。形容非常安静。", s:"考试开始了，教室里鸦雀无声。"},
  {a:"金蝉脱壳", q:"蝉脱去外壳飞走。比喻用计谋脱身，使对方不能及时发觉。", s:"小偷金蝉脱壳，留下假证件逃跑了。"},
  {a:"蜻蜓点水", q:"蜻蜓在水面飞时轻轻点触水面。比喻做事肤浅，不深入。", s:"读书不能蜻蜓点水，要细细品味。"},
  {a:"蛛丝马迹", q:"蜘蛛的细丝，马蹄的痕迹。比喻事情留下的隐约可寻的线索。", s:"警察根据蛛丝马迹，很快破了案。"},
  {a:"蜂拥而至", q:"像一窝蜂似的拥过来。形容很多人乱哄哄地一起到来。", s:"商店一开门，顾客就蜂拥而至。"},
  // 数字成语
  {a:"一举两得", q:"做一件事，得到两方面的好处。", s:"这样既学习了知识又锻炼了身体，真是一举两得。"},
  {a:"一箭双雕", q:"一箭射中两只雕。比喻做一件事达到两个目的。", s:"他这一招一箭双雕，解决了两个难题。"},
  {a:"一日千里", q:"一天能走一千里。形容进展或发展极快。", s:"科技发展一日千里，我们要努力学习。"},
  {a:"一目十行", q:"一眼能看十行字。形容阅读速度非常快。", s:"他读书一目十行，速度很快。"},
  {a:"一曝十寒", q:"晒一天，又冻十天。比喻学习或工作没有恒心，常常间断。", s:"学习最怕一曝十寒，要坚持不懈。"},
  {a:"三心二意", q:"又想这样又想那样。形容犹豫不决，意志不专一。", s:"做事不能三心二意，要专心致志。"},
  {a:"三思而行", q:"反复考虑，然后再去做。指做事谨慎。", s:"遇到事情要三思而行。"},
  {a:"三头六臂", q:"三个脑袋，六条手臂。比喻神通广大，本领非凡。", s:"他又忙工作忙家务，恨不得有三头六臂。"},
  {a:"四面八方", q:"泛指周围各个方面或各个地方。", s:"人们从四面八方赶来参加运动会。"},
  {a:"四通八达", q:"四面八方都有路可通。形容交通非常便利。", s:"这里的交通四通八达，非常方便。"},
  {a:"五花八门", q:"比喻花样繁多，种类繁多。", s:"商店里的商品五花八门，让人挑花了眼。"},
  {a:"五光十色", q:"形容色彩鲜艳，式样繁多。", s:"节日的夜晚，五光十色的灯真好看。"},
  {a:"五彩缤纷", q:"各种颜色错杂灿烂，十分好看。", s:"花园里开满了五彩缤纷的花。"},
  {a:"五颜六色", q:"形容色彩复杂或花样繁多。", s:"天空中飘着五颜六色的气球。"},
  {a:"五湖四海", q:"泛指全国各地，有时也指世界各地。", s:"来自五湖四海的朋友欢聚一堂。"},
  {a:"六神无主", q:"形容心慌意乱，拿不定主意。", s:"突然发生的事让他六神无主。"},
  {a:"七嘴八舌", q:"你一言，我一语。形容人多口杂，议论纷纷。", s:"大家七嘴八舌地讨论起来。"},
  {a:"七手八脚", q:"形容人多手杂，动作忙乱的样子。", s:"同学们七手八脚地搬桌子。"},
  {a:"八面玲珑", q:"原指窗户明亮宽敞。后形容为人处世圆滑，各方面都应付周到。", s:"他为人处事八面玲珑，谁也不得罪。"},
  {a:"九牛一毛", q:"九头牛身上的一根毛。比喻极大数量中微不足道的一点。", s:"这点损失对整个工程来说只是九牛一毛。"},
  {a:"九死一生", q:"形容经历很大危险而幸存下来。", s:"他经历了九死一生，终于走出了沙漠。"},
  {a:"十全十美", q:"各方面都非常完美，毫无缺陷。", s:"世界上没有十全十美的人。"},
  {a:"十拿九稳", q:"比喻很有把握，十分可靠。", s:"这次比赛他准备充分，获胜十拿九稳。"},
  {a:"百发百中", q:"每次都命中目标。比喻做事有充分把握，绝不落空。", s:"他是神枪手，百发百中。"},
  {a:"百战百胜", q:"每战必胜。形容所向无敌。", s:"这支队伍纪律严明，百战百胜。"},
  {a:"千方百计", q:"想尽或用尽种种办法。", s:"老师千方百计地帮助我们提高成绩。"},
  {a:"千丝万缕", q:"千根丝，万根线。形容相互之间关系密切而复杂。", s:"这件事和他有着千丝万缕的联系。"},
  {a:"千辛万苦", q:"各种各样的艰难困苦。", s:"父母历尽千辛万苦把我们养大。"},
  {a:"千真万确", q:"形容情况非常确实，不容怀疑。", s:"这个消息千真万确，你不用怀疑。"},
  {a:"万众一心", q:"千万人一条心。形容团结一致。", s:"全国人民万众一心，战胜了困难。"},
  {a:"万无一失", q:"绝对不会出差错。形容有绝对把握。", s:"为了确保万无一失，他又检查了一遍。"},
  // 团结智慧
  {a:"齐心协力", q:"思想一致，共同努力。", s:"全班同学齐心协力，终于赢得了拔河比赛。"},
  {a:"众志成城", q:"大家同心协力，就像城墙一样牢固。比喻团结一致，力量无比强大。", s:"灾难面前，全国人民众志成城。"},
  {a:"同舟共济", q:"同坐一条船，共同渡河。比喻同心协力，共渡难关。", s:"困难面前，我们要同舟共济。"},
  {a:"风雨同舟", q:"在狂风暴雨中同乘一条船。比喻共同经历患难。", s:"我们小组风雨同舟，一起克服了困难。"},
  {a:"神机妙算", q:"惊人的机智，巧妙的谋划。形容善于估计形势，决定策略。", s:"诸葛亮神机妙算，借来了东风。"},
  {a:"足智多谋", q:"智慧丰富，善于谋划。形容人善于料事和用计。", s:"吴用足智多谋，人称智多星。"},
  {a:"智勇双全", q:"既有智谋，又很勇敢，二者兼备。", s:"赵云智勇双全，深受刘备器重。"},
  {a:"料事如神", q:"预料事情像神仙一样准确。形容预料事情非常准确。", s:"他料事如神，大家都佩服他的判断力。"},
  // 技艺
  {a:"能工巧匠", q:"工艺技术高明的人。", s:"故宫的建造凝聚着古代能工巧匠的智慧。"},
  {a:"巧夺天工", q:"人工的精巧胜过天然。形容技艺极其精巧。", s:"这件玉雕巧夺天工，令人赞叹。"},
  {a:"鬼斧神工", q:"像是鬼神制作出来的。形容艺术技巧高超，不像人力所能达到的。", s:"桂林的溶洞景观鬼斧神工，令人称奇。"},
  {a:"精益求精", q:"已经很好了，还要求更好。表示要求极高。", s:"他对作品精益求精，改了一遍又一遍。"},
  // 时间变化
  {a:"光阴似箭", q:"时间像飞箭一样迅速流逝。形容时间过得极快。", s:"光阴似箭，转眼间我们已经是六年级学生了。"},
  {a:"日月如梭", q:"太阳和月亮像梭子一样来去。形容时间过得很快。", s:"日月如梭，我们要珍惜时间，努力学习。"},
  {a:"分秒必争", q:"一分一秒都要争取。形容抓紧时间。", s:"考试快到了，同学们分秒必争地复习。"},
  {a:"一日三秋", q:"一天不见面，就像过了三年。形容思念的心情非常迫切。", s:"好朋友转学了，我觉得一日三秋。"},
  {a:"日新月异", q:"每天都在更新，每月都有变化。形容发展、进步很快。", s:"我们的家乡日新月异，变化真大。"},
  {a:"焕然一新", q:"一改旧貌，呈现出崭新的样子。", s:"打扫之后，教室焕然一新。"},
  // 热闹稀少
  {a:"人山人海", q:"人群如山似海。形容聚集的人非常多。", s:"国庆节的广场上人山人海。"},
  {a:"车水马龙", q:"车像流水，马像游龙。形容来往车马很多，十分热闹。", s:"大城市里车水马龙，非常热闹。"},
  {a:"川流不息", q:"像河水一样流个不停。形容行人、车马等连续不断。", s:"马路上的汽车川流不息。"},
  {a:"摩肩接踵", q:"肩碰着肩，脚碰着脚。形容人很多，非常拥挤。", s:"庙会上摩肩接踵，热闹极了。"},
  {a:"门庭若市", q:"门前和院子里像集市一样热闹。形容来的人很多。", s:"这家新开的商店门庭若市，生意红火。"},
  {a:"座无虚席", q:"座位没有空着的。形容出席的人很多。", s:"音乐会开始了，大厅里座无虚席。"},
  {a:"水泄不通", q:"连水都流不出去。形容十分拥挤或包围得非常严密。", s:"演唱会现场被粉丝围得水泄不通。"},
  {a:"络绎不绝", q:"人、马、车、船来来往往，连续不断。", s:"来参观的人络绎不绝。"},
  // 著名完美
  {a:"举世闻名", q:"全世界都知道。形容非常著名。", s:"长城是举世闻名的古建筑。"},
  {a:"闻名遐迩", q:"远近都知道。形容名声很大。", s:"杭州的西湖闻名遐迩。"},
  {a:"举世无双", q:"全世界找不到第二个。形容极其稀有、罕见。", s:"兵马俑是举世无双的艺术珍品。"},
  {a:"独一无二", q:"没有相同的，没有可以相比的。", s:"这是独一无二的礼物，我很珍惜。"},
  // 欣赏留恋
  {a:"美不胜收", q:"美好的东西太多，一时看不过来。", s:"公园里的景色美不胜收。"},
  {a:"赏心悦目", q:"因欣赏美好的景物而心情愉快。", s:"这幅画色彩柔和，赏心悦目。"},
  {a:"目不暇接", q:"东西太多，眼睛看不过来。", s:"灯会上的花灯多得让人目不暇接。"},
  {a:"眼花缭乱", q:"眼睛看见复杂纷繁的东西而感到迷乱。", s:"货架上的玩具五花八门，看得我眼花缭乱。"},
  {a:"琳琅满目", q:"满眼都是珍贵的东西。形容美好的事物很多。", s:"书店里的书琳琅满目。"},
  {a:"心旷神怡", q:"心境开阔，精神愉快。", s:"站在山顶上，凉风习习，让人心旷神怡。"},
  {a:"恋恋不舍", q:"十分留恋，舍不得离开。", s:"要离开动物园了，我恋恋不舍。"},

const TOTAL = 10;
document.getElementById('subtitle').textContent = `读一读解释，选出正确的成语吧！每轮 ${TOTAL} 题 · 题库共 ${BANK.length} 个成语`;

let questions = [], idx = 0, score = 0, locked = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildQuestions(){
  const picked = shuffle([...BANK]).slice(0, TOTAL);
  return picked.map(item => {
    const others = shuffle(BANK.filter(x => x.a !== item.a)).slice(0,3).map(x => x.a);
    const opts = shuffle([item.a, ...others]);
    return { ...item, opts };
  });
}

function startGame(){
  questions = buildQuestions();
  idx = 0; score = 0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('score').textContent = 0;
  renderQuestion();
}

function renderQuestion(){
  locked = false;
  const q = questions[idx];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qNum').textContent = (idx+1) + '/' + TOTAL;
  document.getElementById('progressBar').style.width = (idx/TOTAL*100) + '%';
  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.innerHTML = '';
  document.getElementById('nextBtn').classList.remove('show');

  const wrap = document.getElementById('opts');
  wrap.innerHTML = '';
  q.opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => answer(b, opt, q);
    wrap.appendChild(b);
  });

  if(autoReadOn()) speak(q.q); else stopSpeak();
}

function answer(btn, opt, q){
  if(locked) return;
  locked = true;
  const correct = opt === q.a;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => {
    b.disabled = true;
    if(b.textContent === q.a) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  if(correct){
    score++;
    document.getElementById('score').textContent = score;
    beep(880, 0.12); setTimeout(()=>beep(1175,0.15), 120);
  } else {
    beep(220, 0.25);
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'no');
  fb.innerHTML = (correct ? '<b>🎉 答对啦！</b><br>' : '<b>💪 别灰心，正确答案是「' + q.a + '」</b><br>')
    + '【' + q.a + '】' + q.q + '<br>📝 例句：' + q.s;

  document.getElementById('progressBar').style.width = ((idx+1)/TOTAL*100) + '%';
  const nb = document.getElementById('nextBtn');
  nb.textContent = (idx === TOTAL-1) ? '查看成绩 🏁' : '下一题 ▶';
  nb.classList.add('show');

  if(autoReadOn()){
    speak((correct ? '答对啦！' : '正确答案是，' + q.a + '。') + q.a + '，' + q.q + '。例句，' + q.s);
  }
}

function nextQuestion(){
  if(idx === TOTAL-1){ showResult(); return; }
  idx++;
  renderQuestion();
}

function showResult(){
  stopSpeak();
  document.getElementById('gameScreen').classList.add('hidden');
  const end = document.getElementById('endScreen');
  end.classList.remove('hidden');
  document.getElementById('resultScore').textContent = '你答对了 ' + score + ' / ' + TOTAL + ' 题';

  let emoji, stars, msg;
  if(score === TOTAL){ emoji='🏆'; stars='⭐⭐⭐'; msg='太棒了，全部答对！你是真正的成语小达人！'; }
  else if(score >= 8){ emoji='🥇'; stars='⭐⭐⭐'; msg='非常厉害！继续保持，成语知识越来越丰富！'; }
  else if(score >= 6){ emoji='🥈'; stars='⭐⭐'; msg='很不错！再复习一下错题，下次冲击满分！'; }
  else if(score >= 4){ emoji='🥉'; stars='⭐'; msg='有进步空间哦，多读成语故事，你会更棒！'; }
  else { emoji='📖'; stars='☆'; msg='别灰心！每天学几个成语，下次一定行！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultMsg').textContent = msg;

  beep(660,0.12); setTimeout(()=>beep(880,0.12),130); setTimeout(()=>beep(1108,0.2),260);
}

// 读题（Web Speech API）
const synthOK = 'speechSynthesis' in window;
let zhVoice = null;
function pickVoice(){
  if(!synthOK) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /^zh([-_]CN)?/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
}
if(synthOK){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text){
  if(!synthOK) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(zhVoice) u.voice = zhVoice;
  u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.1;
  const btn = document.getElementById('readBtn');
  btn.classList.add('speaking');
  const done = () => btn.classList.remove('speaking');
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function stopSpeak(){ if(synthOK) speechSynthesis.cancel(); document.getElementById('readBtn').classList.remove('speaking'); }
function autoReadOn(){ return document.getElementById('autoRead').checked; }
function readQuestion(){ if(questions.length) speak(questions[idx].q); }

document.getElementById('autoRead').addEventListener('change', function(){
  document.getElementById('autoChip').classList.toggle('off', !this.checked);
  if(this.checked && !document.getElementById('gameScreen').classList.contains('hidden')) readQuestion();
  else stopSpeak();
});
window.addEventListener('pagehide', stopSpeak);

// 简单音效
function beep(freq, dur){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  }catch(e){}
}
