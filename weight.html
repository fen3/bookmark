<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1420">
    <meta name="description" content="体重记录：记录每日体重、查看趋势曲线与目标进度，数据仅保存在本机。">
    <title>体重记录 · Weight Log</title>
    <link rel="icon" href="/favicon.png">
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b10;
            --panel: #101720;
            --line: #1e2a38;
            --text: #e8eef7;
            --muted: #8a9bb0;
            --dim: #5b6b80;
            --accent: #4f8cff;
            --accent-2: #8b5cf6;
            --green: #4ade80;
            --amber: #fbbf24;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(820px 460px at 12% -12%, rgba(79, 140, 255, .16), transparent 62%),
                radial-gradient(720px 420px at 96% 0%, rgba(139, 92, 246, .14), transparent 58%),
                var(--bg);
            background-attachment: fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        [hidden] {
            display: none !important;
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 18px 48px;
        }

        /* ---------- top ---------- */
        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--muted);
            font-size: 16px;
            text-decoration: none;
            transition: color .2s, border-color .2s, background .2s;
        }

        .back:hover {
            color: var(--text);
            border-color: #3b4d63;
            background: rgba(255, 255, 255, .04);
        }

        .brand h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .01em;
        }

        .brand p {
            margin: 2px 0 0;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: .2em;
        }

        .local-chip {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(16, 23, 32, .7);
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .local-chip i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        /* ---------- cards ---------- */
        .card {
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: linear-gradient(180deg, #121a25 0%, #0f1620 100%);
        }

        .card-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .card-head h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .02em;
        }

        .card-head .hint {
            color: var(--dim);
            font-size: 11px;
        }

        /* ---------- summary ---------- */
        .cur-label {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: .08em;
        }

        .cur-value {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 6px;
        }

        .cur-value strong {
            font-size: clamp(44px, 12vw, 54px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.02em;
            background: linear-gradient(120deg, #8ab6ff, #b49bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .cur-value span {
            color: var(--muted);
            font-size: 15px;
        }

        .cur-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        .delta {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }

        .delta.up {
            color: var(--amber);
            background: rgba(251, 191, 36, .1);
        }

        .delta.down {
            color: var(--green);
            background: rgba(74, 222, 128, .1);
        }

        .delta.flat {
            color: var(--muted);
            background: rgba(255, 255, 255, .05);
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .fact span {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 11px;
        }

        .fact strong {
            font-size: 15px;
            font-weight: 600;
        }

        .fact strong em {
            margin-left: 2px;
            color: var(--muted);
            font-size: 11px;
            font-style: normal;
            font-weight: 400;
        }

        /* ---------- goal ---------- */
        .goal {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .goal-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .goal-head>span {
            color: var(--muted);
            font-size: 12px;
        }

        .goal-set {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .goal-set input {
            width: 72px;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #0b1119;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .goal-set input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 140, 255, .14);
        }

        .goal-set .unit {
            color: var(--muted);
            font-size: 11px;
        }

        .mini-btn {
            padding: 7px 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: rgba(255, 255, 255, .04);
            color: var(--text);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }

        .mini-btn:hover {
            border-color: #3b4d63;
            background: rgba(255, 255, 255, .07);
        }

        .meter {
            height: 6px;
            margin-top: 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .07);
            overflow: hidden;
        }

        .meter i {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width .5s ease;
        }

        .goal-desc {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        /* ---------- form ---------- */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            color: var(--muted);
            font-size: 11px;
        }

        .field input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #0b1119;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 140, 255, .14);
        }

        .field input::placeholder {
            color: #4b5c70;
        }

        .input-unit {
            position: relative;
        }

        .input-unit input {
            padding-right: 40px;
        }

        .input-unit span {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 12px;
            pointer-events: none;
        }

        .btn-primary {
            grid-column: 1 / -1;
            padding: 12px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter .2s, transform .12s;
        }

        .btn-primary:hover {
            filter: brightness(1.08);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        /* ---------- chart ---------- */
        .range {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .03);
        }

        .range button {
            padding: 5px 10px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .range button:hover {
            color: var(--text);
        }

        .range button.active {
            background: rgba(79, 140, 255, .18);
            color: #cfe0ff;
        }

        .chart-box {
            position: relative;
        }

        #chart {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        #chart text {
            fill: #5b6b80;
            font-family: inherit;
            font-size: 10px;
        }

        #chart .line {
            fill: none;
            stroke: url(#lineGrad);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            animation: draw 1.1s ease forwards;
        }

        #chart .area {
            fill: url(#areaGrad);
        }

        #chart .pt {
            fill: #0b1119;
            stroke: url(#lineGrad);
            stroke-width: 2;
        }

        #chart .hit {
            fill: transparent;
            cursor: pointer;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        .tip {
            position: absolute;
            z-index: 3;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #1b2636;
            box-shadow: 0 8px 22px rgba(0, 0, 0, .4);
            color: var(--text);
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -130%);
            transition: opacity .15s;
        }

        .tip.show {
            opacity: 1;
        }

        .tip strong {
            display: block;
            font-size: 13px;
        }

        .tip span {
            color: var(--muted);
            font-size: 10px;
        }

        /* ---------- list ---------- */
        .list-count {
            color: var(--muted);
            font-size: 11px;
        }

        .list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            cursor: pointer;
            transition: background .15s;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row:hover {
            background: rgba(255, 255, 255, .025);
        }

        .row-date {
            flex: none;
            width: 72px;
        }

        .row-date strong {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .row-date span {
            color: var(--muted);
            font-size: 10px;
        }

        .row-main {
            display: flex;
            flex: 1;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .row-kg {
            font-size: 16px;
            font-weight: 700;
        }

        .row-kg em {
            margin-left: 2px;
            color: var(--muted);
            font-size: 10px;
            font-style: normal;
            font-weight: 500;
        }

        .row-note {
            overflow: hidden;
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .row-delta {
            flex: none;
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }

        .row-delta.up {
            color: var(--amber);
            background: rgba(251, 191, 36, .1);
        }

        .row-delta.down {
            color: var(--green);
            background: rgba(74, 222, 128, .1);
        }

        .row-delta.flat {
            color: var(--dim);
            background: transparent;
        }

        .del {
            flex: none;
            width: 28px;
            height: 28px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: var(--dim);
            font-family: inherit;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .del:hover {
            color: #f87171;
            border-color: rgba(248, 113, 113, .3);
            background: rgba(248, 113, 113, .08);
        }

        /* ---------- misc ---------- */
        .empty {
            padding: 26px 0;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .foot {
            margin-top: 18px;
            color: #4b5c70;
            font-size: 11px;
            line-height: 1.8;
            text-align: center;
        }

        .foot a {
            color: #7f93ab;
            text-decoration: none;
        }

        .foot a:hover {
            color: var(--accent);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            z-index: 20;
            padding: 9px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(20, 28, 40, .96);
            color: var(--text);
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, 12px);
            transition: opacity .2s, transform .2s;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 520px) {
            .page {
                padding: 18px 14px 40px;
            }

            .brand p {
                display: none;
            }

            .card {
                padding: 15px;
            }

            .row-date {
                width: 62px;
            }

            .row-note {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #chart .line {
                animation: none;
                stroke-dashoffset: 0;
            }

            .meter i {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="top">
            <a class="back" href="./index.html" aria-label="返回首页">←</a>
            <div class="brand">
                <h1>体重记录</h1>
                <p>WEIGHT LOG</p>
            </div>
            <span class="local-chip"><i></i>仅存本机</span>
        </header>

        <section class="card summary">
            <span class="cur-label">当前体重</span>
            <div class="cur-value"><strong id="curKg">--</strong><span>kg</span></div>
            <div class="cur-meta">
                <span id="curDate">尚无记录</span>
                <span id="curDelta" class="delta flat">等待第一条记录</span>
            </div>

            <div class="facts">
                <div class="fact">
                    <span>累计变化</span>
                    <strong id="factTotal">—</strong>
                </div>
                <div class="fact">
                    <span>最低 / 最高</span>
                    <strong id="factMinMax">—</strong>
                </div>
                <div class="fact">
                    <span>记录条数</span>
                    <strong id="factCount">0</strong>
                </div>
            </div>

            <div class="goal">
                <div class="goal-head">
                    <span>目标体重</span>
                    <div class="goal-set">
                        <input id="goalInput" type="number" step="0.1" min="20" max="300" inputmode="decimal"
                            placeholder="未设置" aria-label="目标体重（kg）">
                        <span class="unit">kg</span>
                        <button id="goalBtn" class="mini-btn" type="button">保存</button>
                    </div>
                </div>
                <div id="goalMeter" class="meter-wrap" hidden>
                    <div class="meter"><i id="goalFill"></i></div>
                    <p id="goalDesc" class="goal-desc"></p>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>添加记录</h2>
                <span class="hint">同一天再次保存会覆盖原记录</span>
            </div>
            <form id="form">
                <div class="field">
                    <label for="date">日期</label>
                    <input id="date" type="date" required>
                </div>
                <div class="field">
                    <label for="weight">体重</label>
                    <div class="input-unit">
                        <input id="weight" type="number" step="0.1" min="20" max="300" inputmode="decimal"
                            placeholder="0.0" required>
                        <span>kg</span>
                    </div>
                </div>
                <div class="field full">
                    <label for="note">备注（可选）</label>
                    <input id="note" type="text" maxlength="30" placeholder="如：晨起空腹">
                </div>
                <button class="btn-primary" type="submit">保存记录</button>
            </form>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>趋势</h2>
                <div class="range" id="range">
                    <button type="button" data-range="7">7 天</button>
                    <button type="button" data-range="30">30 天</button>
                    <button type="button" data-range="90">90 天</button>
                    <button type="button" data-range="all" class="active">全部</button>
                </div>
            </div>
            <div class="chart-box" id="chartBox">
                <svg id="chart" viewBox="0 0 720 250" role="img" aria-label="体重趋势折线图"></svg>
                <div class="tip" id="tip"></div>
            </div>
            <p class="empty" id="chartEmpty" hidden>还没有数据，添加第一条记录后显示趋势</p>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>历史记录</h2>
                <span class="list-count" id="listCount">0 条</span>
            </div>
            <ul class="list" id="list"></ul>
            <p class="empty" id="listEmpty">还没有记录，从上方添加第一条吧</p>
        </section>

        <p class="foot">
            数据保存在当前浏览器，清理浏览器数据会丢失记录。<br>
            <a href="./index.html">← 返回首页</a>
        </p>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            'use strict'

            const RECORDS_KEY = 'weightlog.records'
            const GOAL_KEY = 'weightlog.goal'

            const $ = (id) => document.getElementById(id)
            const form = $('form')
            const dateInput = $('date')
            const weightInput = $('weight')
            const noteInput = $('note')
            const goalInput = $('goalInput')
            const goalBtn = $('goalBtn')
            const goalMeter = $('goalMeter')
            const goalFill = $('goalFill')
            const goalDesc = $('goalDesc')
            const chartSvg = $('chart')
            const chartBox = $('chartBox')
            const chartEmpty = $('chartEmpty')
            const tip = $('tip')
            const listEl = $('list')
            const listEmpty = $('listEmpty')
            const listCount = $('listCount')
            const toastEl = $('toast')

            const esc = (str) => String(str).replace(/[&<>"]/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
            }[c]))
            const pad2 = (n) => String(n).padStart(2, '0')
            const todayStr = () => {
                const d = new Date()
                return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`
            }
            const daysAgoStr = (n) => {
                const d = new Date()
                d.setDate(d.getDate() - n)
                return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`
            }
            const parseDate = (s) => {
                const [y, m, d] = s.split('-').map(Number)
                return new Date(y, m - 1, d)
            }
            const fmtDate = (s) => {
                const [, m, d] = s.split('-').map(Number)
                return `${m}月${d}日`
            }
            const weekday = (s) => ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][parseDate(s).getDay()]
            const signed = (n) => `${n > 0 ? '+' : ''}${n.toFixed(1)}`

            let records = loadRecords()
            let goal = loadGoal()
            let activeRange = 'all'
            let toastTimer = null

            function loadRecords() {
                try {
                    const raw = localStorage.getItem(RECORDS_KEY)
                    const arr = raw ? JSON.parse(raw) : []
                    if (!Array.isArray(arr)) return []
                    return arr
                        .filter((r) => r && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && typeof r.kg === 'number' && isFinite(r.kg))
                        .map((r) => ({ date: r.date, kg: Math.round(r.kg * 10) / 10, note: typeof r.note === 'string' ? r.note : '' }))
                } catch (err) {
                    return []
                }
            }

            function loadGoal() {
                try {
                    const v = parseFloat(localStorage.getItem(GOAL_KEY))
                    return isFinite(v) && v > 0 ? v : null
                } catch (err) {
                    return null
                }
            }

            function persist() {
                try {
                    localStorage.setItem(RECORDS_KEY, JSON.stringify(records))
                } catch (err) {
                    toast('保存失败：浏览器存储不可用')
                }
            }

            function toast(msg) {
                toastEl.textContent = msg
                toastEl.classList.add('show')
                clearTimeout(toastTimer)
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800)
            }

            function render() {
                records.sort((a, b) => a.date.localeCompare(b.date))
                renderSummary()
                renderGoal()
                renderChart()
                renderList()
            }

            /* ---------- summary ---------- */
            function renderSummary() {
                const count = records.length
                const cur = records[count - 1]
                const first = records[0]

                $('curKg').textContent = cur ? cur.kg.toFixed(1) : '--'
                $('curDate').textContent = cur ? `${fmtDate(cur.date)} · ${weekday(cur.date)}` : '尚无记录'

                const deltaEl = $('curDelta')
                deltaEl.className = 'delta flat'
                if (!cur) {
                    deltaEl.textContent = '等待第一条记录'
                } else if (count < 2) {
                    deltaEl.textContent = '首条记录'
                } else {
                    const d = Math.round((cur.kg - records[count - 2].kg) * 10) / 10
                    deltaEl.textContent = `较上次 ${signed(d)} kg`
                    deltaEl.classList.add(d > 0 ? 'up' : d < 0 ? 'down' : 'flat')
                }

                const totalEl = $('factTotal')
                if (count >= 2) {
                    const d = Math.round((cur.kg - first.kg) * 10) / 10
                    totalEl.innerHTML = `${signed(d)}<em>kg</em>`
                } else {
                    totalEl.textContent = '—'
                }

                if (count) {
                    const values = records.map((r) => r.kg)
                    $('factMinMax').innerHTML = `${Math.min(...values).toFixed(1)} / ${Math.max(...values).toFixed(1)}<em>kg</em>`
                } else {
                    $('factMinMax').textContent = '—'
                }

                $('factCount').textContent = count
            }

            /* ---------- goal ---------- */
            function renderGoal() {
                goalInput.value = goal == null ? '' : goal.toFixed(1)

                if (goal == null) {
                    goalMeter.hidden = true
                    return
                }
                goalMeter.hidden = false

                if (!records.length) {
                    goalFill.style.width = '0%'
                    goalDesc.innerHTML = `<span>目标 ${goal.toFixed(1)} kg</span><span>添加记录后显示进度</span>`
                    return
                }

                const start = records[0].kg
                const cur = records[records.length - 1].kg
                const gaining = goal > start
                let pct

                if (records.length < 2) {
                    pct = (gaining ? cur >= goal : cur <= goal) ? 100 : 0
                } else {
                    const total = start - goal
                    pct = Math.abs(total) < 0.05 ? 100 : ((start - cur) / total) * 100
                }
                pct = Math.max(0, Math.min(100, pct))
                goalFill.style.width = pct.toFixed(1) + '%'

                const gap = gaining ? goal - cur : cur - goal
                let text
                if (Math.abs(gap) < 0.05) text = '已达成目标'
                else if (gap > 0) text = `还差 ${gap.toFixed(1)} kg`
                else text = `已超出目标 ${Math.abs(gap).toFixed(1)} kg`

                goalDesc.innerHTML = `<span>目标 ${goal.toFixed(1)} kg · ${text}</span><span>起点 ${start.toFixed(1)} kg</span>`
            }

            function saveGoal() {
                const raw = goalInput.value.trim()
                if (!raw) {
                    goal = null
                    try { localStorage.removeItem(GOAL_KEY) } catch (err) { /* ignore */ }
                    render()
                    toast('已清除目标')
                    return
                }
                const v = parseFloat(raw)
                if (!isFinite(v) || v < 20 || v > 300) {
                    toast('目标需在 20–300 kg 之间')
                    goalInput.focus()
                    return
                }
                goal = Math.round(v * 10) / 10
                try { localStorage.setItem(GOAL_KEY, String(goal)) } catch (err) { /* ignore */ }
                render()
                toast('目标已更新')
            }

            /* ---------- chart ---------- */
            function renderChart() {
                let data = records
                if (activeRange !== 'all') {
                    const cutoff = daysAgoStr(Number(activeRange) - 1)
                    data = records.filter((r) => r.date >= cutoff)
                }

                if (!data.length) {
                    chartSvg.innerHTML = ''
                    chartBox.hidden = true
                    chartEmpty.hidden = false
                    chartEmpty.textContent = records.length
                        ? '该时间范围内没有记录，可切换到「全部」查看'
                        : '还没有数据，添加第一条记录后显示趋势'
                    return
                }

                chartBox.hidden = false
                chartEmpty.hidden = true

                const W = 720
                const H = 250
                const PL = 44
                const PR = 16
                const PT = 16
                const PB = 30

                const values = data.map((r) => r.kg)
                const min = Math.min(...values)
                const max = Math.max(...values)
                const pad = Math.max(0.6, (max - min) * 0.2)
                const lo = min - pad
                const hi = max + pad
                const spread = hi - lo

                const t0 = parseDate(data[0].date).getTime()
                const t1 = parseDate(data[data.length - 1].date).getTime()
                const span = t1 - t0

                const xOf = (date) => span === 0
                    ? PL + (W - PL - PR) / 2
                    : PL + ((parseDate(date).getTime() - t0) / span) * (W - PL - PR)
                const yOf = (v) => PT + (1 - (v - lo) / spread) * (H - PT - PB)

                const parts = []

                parts.push(`<defs>
                    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#4f8cff"></stop>
                        <stop offset="1" stop-color="#8b5cf6"></stop>
                    </linearGradient>
                    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="rgba(79,140,255,.26)"></stop>
                        <stop offset="1" stop-color="rgba(79,140,255,0)"></stop>
                    </linearGradient>
                </defs>`)

                for (let i = 0; i < 4; i++) {
                    const v = lo + (spread * i) / 3
                    const y = yOf(v)
                    parts.push(`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 5"></line>`)
                    parts.push(`<text x="${PL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`)
                }

                const ticks = span === 0 ? [t0] : [t0, t0 + span / 2, t1]
                ticks.forEach((t, i) => {
                    const x = span === 0
                        ? PL + (W - PL - PR) / 2
                        : PL + ((t - t0) / span) * (W - PL - PR)
                    const anchor = span === 0 ? 'middle' : i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle'
                    const dt = new Date(t)
                    parts.push(`<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${anchor}">${dt.getMonth() + 1}/${dt.getDate()}</text>`)
                })

                if (goal != null && goal >= lo && goal <= hi) {
                    const gy = yOf(goal).toFixed(1)
                    parts.push(`<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="rgba(139,92,246,.5)" stroke-width="1.2" stroke-dasharray="5 5"></line>`)
                    parts.push(`<text x="${W - PR}" y="${(Number(gy) - 6).toFixed(1)}" text-anchor="end" style="fill:#a78bfa">目标 ${goal.toFixed(1)}</text>`)
                }

                if (data.length > 1) {
                    const base = (H - PB).toFixed(1)
                    const linePts = data.map((r) => `${xOf(r.date).toFixed(1)} ${yOf(r.kg).toFixed(1)}`)
                    const areaPath = `M ${xOf(data[0].date).toFixed(1)} ${base} L ${linePts.join(' L ')} L ${xOf(data[data.length - 1].date).toFixed(1)} ${base} Z`
                    parts.push(`<path class="area" d="${areaPath}"></path>`)
                    parts.push(`<path class="line" pathLength="1" d="M ${linePts.join(' L ')}"></path>`)
                }

                data.forEach((r) => {
                    const x = xOf(r.date).toFixed(1)
                    const y = yOf(r.kg).toFixed(1)
                    parts.push(`<circle class="pt" cx="${x}" cy="${y}" r="3.4"></circle>`)
                    parts.push(`<circle class="hit" cx="${x}" cy="${y}" r="12" data-date="${r.date}" data-kg="${r.kg.toFixed(1)}"></circle>`)
                })

                chartSvg.innerHTML = parts.join('')
                bindChartHover()
            }

            function bindChartHover() {
                chartSvg.querySelectorAll('.hit').forEach((el) => {
                    el.addEventListener('pointerenter', () => {
                        const k = chartSvg.getBoundingClientRect().width / 720
                        const cx = Number(el.getAttribute('cx'))
                        const cy = Number(el.getAttribute('cy'))
                        tip.innerHTML = `<strong>${esc(el.dataset.kg)} kg</strong><span>${esc(fmtDate(el.dataset.date))} · ${esc(weekday(el.dataset.date))}</span>`
                        tip.style.left = (cx * k) + 'px'
                        tip.style.top = (cy * k) + 'px'
                        tip.classList.add('show')
                    })
                    el.addEventListener('pointerleave', () => tip.classList.remove('show'))
                    el.addEventListener('pointerdown', () => tip.classList.remove('show'))
                })
            }

            /* ---------- list ---------- */
            function renderList() {
                listCount.textContent = `${records.length} 条`

                if (!records.length) {
                    listEl.innerHTML = ''
                    listEl.hidden = true
                    listEmpty.hidden = false
                    return
                }
                listEl.hidden = false
                listEmpty.hidden = true

                const html = records.map((r, idx) => {
                    let deltaHtml = '<span class="row-delta flat">—</span>'
                    if (idx > 0) {
                        const d = Math.round((r.kg - records[idx - 1].kg) * 10) / 10
                        const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat'
                        deltaHtml = `<span class="row-delta ${cls}">${signed(d)}</span>`
                    }
                    return `<li class="row" data-date="${r.date}" title="点击编辑这条记录">
                        <div class="row-date"><strong>${fmtDate(r.date)}</strong><span>${weekday(r.date)}</span></div>
                        <div class="row-main">
                            <span class="row-kg">${r.kg.toFixed(1)}<em>kg</em></span>
                            ${r.note ? `<span class="row-note">${esc(r.note)}</span>` : ''}
                        </div>
                        ${deltaHtml}
                        <button class="del" type="button" data-date="${r.date}" aria-label="删除 ${esc(fmtDate(r.date))} 的记录">×</button>
                    </li>`
                }).reverse().join('')

                listEl.innerHTML = html
            }

            /* ---------- events ---------- */
            form.addEventListener('submit', (evt) => {
                evt.preventDefault()

                const date = dateInput.value
                const kg = parseFloat(weightInput.value)
                const note = noteInput.value.trim().slice(0, 30)

                if (!date) {
                    toast('请选择日期')
                    dateInput.focus()
                    return
                }
                if (!isFinite(kg) || kg < 20 || kg > 300) {
                    toast('请输入 20–300 kg 之间的体重')
                    weightInput.focus()
                    return
                }

                const rounded = Math.round(kg * 10) / 10
                const existing = records.find((r) => r.date === date)

                if (existing) {
                    existing.kg = rounded
                    existing.note = note
                } else {
                    records.push({ date, kg: rounded, note })
                }

                persist()
                render()
                toast(existing ? `已更新 ${fmtDate(date)} 的记录` : `已保存 ${fmtDate(date)} 的记录`)

                weightInput.value = ''
                noteInput.value = ''
                dateInput.value = todayStr()
            })

            goalBtn.addEventListener('click', saveGoal)
            goalInput.addEventListener('keydown', (evt) => {
                if (evt.key === 'Enter') {
                    evt.preventDefault()
                    saveGoal()
                }
            })

            $('range').addEventListener('click', (evt) => {
                const btn = evt.target.closest('button[data-range]')
                if (!btn) return
                activeRange = btn.dataset.range
                $('range').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn))
                renderChart()
            })

            listEl.addEventListener('click', (evt) => {
                const delBtn = evt.target.closest('.del')
                if (delBtn) {
                    const date = delBtn.dataset.date
                    const record = records.find((r) => r.date === date)
                    if (!record) return
                    if (window.confirm(`删除 ${fmtDate(date)} 的记录（${record.kg.toFixed(1)} kg）？`)) {
                        records = records.filter((r) => r.date !== date)
                        persist()
                        render()
                        toast('已删除')
                    }
                    return
                }

                const row = evt.target.closest('.row')
                if (!row) return
                const record = records.find((r) => r.date === row.dataset.date)
                if (!record) return

                dateInput.value = record.date
                weightInput.value = record.kg.toFixed(1)
                noteInput.value = record.note
                form.scrollIntoView({ behavior: 'smooth', block: 'center' })
                weightInput.focus()
                weightInput.select()
            })

            window.addEventListener('resize', () => tip.classList.remove('show'))

            dateInput.value = todayStr()
            render()
        })()
    </script>
</body>

</html>
