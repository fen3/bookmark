  <script src="./assets/rhymes.js"></script>
  <script>
  (function () {
    'use strict';
    var R = window.RHYMES || [];
    var state = { cat: '全部', id: 1, man: false, playing: false, soundOn: true };
    var zhVoice = null;

    function $(id) { return document.getElementById(id); }
    function find(id) { for (var i = 0; i < R.length; i++) if (R[i].id === id) return R[i]; return null; }
    function idxOf(id) { for (var i = 0; i < R.length; i++) if (R[i].id === id) return i; return 0; }
    function getLearned() { try { return JSON.parse(localStorage.getItem('ekrhy_learned') || '[]'); } catch (e) { return []; } }
    function markLearned(id) {
      var a = getLearned();
      if (a.indexOf(id) === -1) { a.push(id); localStorage.setItem('ekrhy_learned', JSON.stringify(a)); }
      $('learnedCount').textContent = a.length;
      renderList();
    }

    /* ---- audio ---- */
    var actx = null;
    function beep(f, d, delay) {
      if (!state.soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(actx.destination);
        var t = actx.currentTime + (delay || 0);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.start(t); o.stop(t + d);
      } catch (e) {}
    }
    function pickZhVoice() {
      if (!('speechSynthesis' in window)) return;
      var vs = window.speechSynthesis.getVoices();
      for (var i = 0; i < vs.length; i++) { if (/zh(-|_)(CN|Hans)/i.test(vs[i].lang)) { zhVoice = vs[i]; break; } }
      if (!zhVoice) { for (var j = 0; j < vs.length; j++) { if (/zh/i.test(vs[j].lang)) { zhVoice = vs[j]; break; } } }
    }
    if ('speechSynthesis' in window) {
      pickZhVoice();
      window.speechSynthesis.onvoiceschanged = pickZhVoice;
    }
    function speak(text, rate, onend) {
      var called = false, timer = null;
      function finish() {
        if (called) return;
        called = true;
        if (timer) clearTimeout(timer);
        if (onend) onend();
      }
      if (!state.soundOn || !('speechSynthesis' in window)) { finish(); return; }
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = rate || 0.9; u.pitch = 1.02;
        if (zhVoice) u.voice = zhVoice;
        u.onend = finish; u.onerror = finish;
        window.speechSynthesis.speak(u);
        timer = setTimeout(finish, Math.max(2000, text.length * 320));
      } catch (e) { finish(); }
    }

    /* ---- list ---- */
    function renderList() {
      var learned = getLearned();
      var items = R.filter(function (r) { return state.cat === '全部' || r.cat === state.cat; });
      var list = $('list');
      list.innerHTML = '';
      items.forEach(function (r) {
        var b = document.createElement('button');
        b.className = 'pcard' + (learned.indexOf(r.id) > -1 ? ' learned' : '');
        b.innerHTML =
          '<div class="top"><span class="icon">' + r.icon + '</span>' +
          '<span class="cat">' + r.cat + '</span>' +
          (learned.indexOf(r.id) > -1 ? '<span class="done">✓ 已学会</span>' : '') + '</div>' +
          '<div class="t">' + r.title + '</div>' +
          '<div class="tz">' + r.titleZh + ' · ' + r.lyrics.length + ' 句</div>' +
          '<div class="preview">' + r.lyrics[0] + '</div>';
        b.addEventListener('click', function () { beep(700, 0.09); open(r.id); });
        list.appendChild(b);
      });
      $('learnedCount').textContent = learned.length;
    }

    /* ---- detail ---- */
    function open(id) {
      var r = find(id); if (!r) return;
      stopReading();
      state.id = id;
      state.man = false;
      $('manBtn').className = 'tool';
      $('manBtn').textContent = '🀄 显示普通话';
      $('hintText').textContent = '点任意一行，也能听普通话大意';

      $('rTitle').innerHTML = r.title + '<small>' + r.titleZh + ' · ' + r.cat + '</small>';
      $('introBox').textContent = r.intro;

      var paper = $('paper');
      paper.innerHTML = '';
      r.lyrics.forEach(function (line, i) {
        var row = document.createElement('div');
        row.className = 'rhyme-line';
        row.innerHTML =
          '<span class="ln">' + (i + 1) + '</span>' +
          '<div class="body"><div class="dy">' + line + '</div>' +
          '<div class="man">' + r.zh[i] + '</div></div>';
        row.addEventListener('click', function () { speak(r.zh[i], 0.92); });
        paper.appendChild(row);
      });

      var nb = $('notes');
      nb.innerHTML = '';
      r.notes.forEach(function (n) {
        var c = document.createElement('span');
        c.className = 'nchip';
        c.innerHTML = '<b>' + n[0] + '</b> ' + n[1];
        nb.appendChild(c);
      });

      $('playBox').textContent = '🎲 ' + r.play;
      $('sourceBox').innerHTML = '歌词来源：<a href="' + r.source + '" target="_blank" rel="noopener">' + r.source.replace(/^https?:\/\/([^\/]+).*/, '$1') + '</a> · 流传版本，字句略有差异';

      showScreen('screen-rhyme');
      window.scrollTo({ top: 0 });
    }

    /* ---- reading ---- */
    var timer = null;
    function stopReading() {
      state.playing = false;
      if (timer) { clearTimeout(timer); timer = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.querySelectorAll('.rhyme-line.playing').forEach(function (x) { x.classList.remove('playing'); });
      var b = $('readBtn');
      if (b) { b.textContent = '🔁 逐句跟读'; b.classList.add('play'); }
    }
    function readAll() {
      if (state.playing) { stopReading(); return; }
      var r = find(state.id); if (!r) return;
      state.playing = true;
      $('readBtn').textContent = '⏸ 暂停';
      $('readBtn').classList.remove('play');
      var rows = $('paper').querySelectorAll('.rhyme-line');
      var i = 0;
      function step() {
        if (!state.playing) return;
        if (i >= rows.length) { stopReading(); return; }
        for (var k = 0; k < rows.length; k++) rows[k].classList.remove('playing');
        rows[i].classList.add('playing');
        rows[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
        var line = r.zh[i];
        i++;
        var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
        speak(line, 0.92, function () {
          if (!state.playing) return;
          var now = (window.performance && performance.now) ? performance.now() : Date.now();
          var wait = Math.max(0, 1500 - (now - t0));
          timer = setTimeout(step, wait + 250);
        });
      }
      step();
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      $(id).classList.add('active');
    }
    function stepCa(delta) {
      var i = idxOf(state.id) + delta;
      if (i < 0) i = R.length - 1;
      if (i >= R.length) i = 0;
      open(R[i].id);
    }

    /* ---- events ---- */
    $('filters').addEventListener('click', function (e) {
      var t = e.target.closest('.filter');
      if (!t) return;
      state.cat = t.getAttribute('data-cat');
      document.querySelectorAll('.filter').forEach(function (f) { f.classList.remove('on'); });
      t.classList.add('on');
      renderList();
    });
    $('backList').addEventListener('click', function () { stopReading(); showScreen('screen-list'); });
    $('readBtn').addEventListener('click', readAll);
    $('stopBtn').addEventListener('click', stopReading);
    $('manBtn').addEventListener('click', function () {
      state.man = !state.man;
      document.querySelectorAll('.rhyme-line .man').forEach(function (z) { z.classList.toggle('show', state.man); });
      this.className = 'tool' + (state.man ? ' on' : '');
      this.textContent = state.man ? '🀄 隐藏普通话' : '🀄 显示普通话';
    });
    $('doneBtn').addEventListener('click', function () {
      markLearned(state.id);
      beep(660, 0.12); beep(880, 0.2, 0.14);
      stopReading();
      setTimeout(function () { stepCa(1); }, 300);
    });
    $('nextBtn').addEventListener('click', function () { stopReading(); stepCa(1); });
    $('prevBtn').addEventListener('click', function () { stopReading(); stepCa(-1); });
    $('soundToggle').addEventListener('click', function () {
      state.soundOn = !state.soundOn;
      this.textContent = state.soundOn ? '🔔' : '🔕';
      if (!state.soundOn) stopReading();
    });

    renderList();
  })();
  </script>
</body>
</html>
