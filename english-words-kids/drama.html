    .script { display: flex; flex-direction: column; gap: 0.75rem; }

    .bubble { flex: 1; background: rgba(255,255,255,0.9); border: 2px solid var(--rule); border-left: 6px solid var(--lc, var(--rule)); border-radius: 14px; padding: 0.55rem 0.85rem; cursor: pointer; }

    .pattern-box, .tip-box { margin-top: 1.1rem; border-radius: 16px; padding: 0.85rem 1rem; font-size: 0.92rem; }

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./">
        <span class="logo">🐻</span>
        <div>英语小短剧<small>English Mini Plays · 14 场</small></div>
      </a>
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <div class="chip" title="已演场数">🎭 <span id="playedCount">0</span>/14</div>
        <button class="sound-toggle" id="soundToggle" title="开关声音">🔔</button>
      </div>
    </header>

    <!-- List -->
    <section class="screen active" id="screen-list">
      <div class="hero">
        <h1>选一场短剧，和伙伴演起来！🎬</h1>
        <p>14 场校园与生活情景剧 · 可以分角色朗读，也可以整场自动播放</p>
      </div>
      <div class="filters" id="filters">
        <button class="filter on" data-lv="0">全部 14</button>
        <button class="filter" data-lv="1">⭐ 一级 入门</button>
        <button class="filter" data-lv="2">⭐⭐ 二级 进阶</button>
        <button class="filter" data-lv="3">⭐⭐⭐ 三级 挑战</button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <!-- Play view -->
    <section class="screen" id="screen-play">
      <div class="mode-head">
        <button class="btn ghost" id="backList">← 返回目录</button>
        <div class="rtitle" id="pTitle"></div>
        <button class="btn ghost" id="nextBtn">下一场 →</button>
      </div>

      <div class="scene" id="pScene"></div>

      <div class="toolbar">
        <button class="tool play" id="playBtn">🎬 播放整场</button>
        <button class="tool" id="stopBtn">⏹ 停止</button>
        <button class="tool" id="zhBtn">🀄 显示中文</button>
      </div>

      <div class="rolebar" id="roleBar"><span class="label">🎭 我演谁：</span></div>

      <div class="script" id="script"></div>

      <div class="pattern-box" id="patternBox"></div>
      <div class="tip-box" id="tipBox"></div>

      <div class="reader-foot">
        <button class="btn teal" id="doneBtn">✅ 演完啦</button>
        <button class="btn ghost" id="prevBtn">← 上一场</button>
      </div>
    </section>

    <footer class="credit">点击台词即可听到发音 🔊 · 建议和家人朋友一人一角，大声读出来</footer>
  </div>

  <script src="./assets/dramas.js"></script>
  <script>
  (function () {
    'use strict';
    var D = window.DRAMAS || [];
    var state = { lv: 0, id: 1, zh: false, role: null, playing: false, soundOn: true };
    var voices = [];

    function $(id) { return document.getElementById(id); }
    function idxOf(id) { for (var i = 0; i < D.length; i++) if (D[i].id === id) return i; return 0; }
    function find(id) { for (var i = 0; i < D.length; i++) if (D[i].id === id) return D[i]; return null; }
    function getPlayed() { try { return JSON.parse(localStorage.getItem('ekd_played') || '[]'); } catch (e) { return []; } }
    function markPlayed(id) {
      var a = getPlayed();
      if (a.indexOf(id) === -1) { a.push(id); localStorage.setItem('ekd_played', JSON.stringify(a)); }
      $('playedCount').textContent = a.length;
      renderList();
    }
    function charOf(d, name) {
      for (var i = 0; i < d.chars.length; i++) if (d.chars[i].name === name) return { c: d.chars[i], i: i };
      return { c: { name: name, emoji: '🙂', color: '#999' }, i: 0 };
    }

    /* ---- audio ---- */
    var actx = null;
    function beep(f, dur, type, delay) {
      if (!state.soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(actx.destination);
        var t = actx.currentTime + (delay || 0);
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t); o.stop(t + dur);
      } catch (e) {}
    }
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      var vs = window.speechSynthesis.getVoices();
      voices = vs.filter(function (v) { return /en(-|_)US/i.test(v.lang); });
      if (!voices.length) voices = vs.filter(function (v) { return /en/i.test(v.lang); });
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
    function speakLine(text, charIndex, rate, onend) {
      var called = false, timer = null;
      function finish() {
        if (called) return;
        called = true;
        if (timer) clearTimeout(timer);
        if (onend) onend();
      }
      if (!state.soundOn || !('speechSynthesis' in window)) { finish(); return; }
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate || 0.82;
        u.pitch = [1.12, 0.9, 1.28, 1.0][charIndex % 4];
        if (voices.length) u.voice = voices[charIndex % voices.length];
        u.onend = finish;
        u.onerror = finish;
        window.speechSynthesis.speak(u);
        var wc = text.trim().split(/\s+/).length;
        timer = setTimeout(finish, Math.max(1800, wc * 420));
      } catch (e) { finish(); }
    }

    /* ---- list ---- */
    function renderList() {
      var list = $('list'), played = getPlayed();
      var items = D.filter(function (d) { return state.lv === 0 || d.level === state.lv; });
      list.innerHTML = '';
      if (!items.length) { list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:2rem">这个级别还没有短剧哦</div>'; return; }
      items.forEach(function (d) {
        var b = document.createElement('button');
        b.className = 'pcard' + (played.indexOf(d.id) > -1 ? ' played' : '');
        b.innerHTML =
          '<div class="top"><span class="icon">' + d.icon + '</span>' +
          '<span class="num">Play ' + d.id + '</span>' +
          '<span class="lv">' + '⭐'.repeat(d.level) + '</span></div>' +
          '<div class="t">' + d.title + '</div>' +
          '<div class="tz">' + d.titleZh + '</div>' +
          '<div class="meta"><span class="cast-mini">' + d.chars.map(function (c) { return c.emoji; }).join('') + '</span>' +
          '<span>' + d.chars.length + ' 个角色 · ' + d.lines.length + ' 句台词</span>' +
          (played.indexOf(d.id) > -1 ? '<span class="done">✓ 演过</span>' : '') +
          '</div>';
        b.addEventListener('click', function () { beep(700, 0.09); open(d.id); });
        list.appendChild(b);
      });
      $('playedCount').textContent = played.length;
    }

    /* ---- play view ---- */
    function open(id) {
      var d = find(id); if (!d) return;
      stopPlaying();
      state.id = id;
      state.zh = false;
      state.role = null;
      $('zhBtn').className = 'tool';
      $('zhBtn').textContent = '🀄 显示中文';

      $('pTitle').innerHTML = d.icon + ' ' + d.title + '<small>' + d.titleZh + ' · ' + '⭐'.repeat(d.level) + '</small>';
      $('pScene').innerHTML = '🎬 <b>' + d.scene + '</b><br>' + d.sceneZh;

      var rb = $('roleBar');
      rb.innerHTML = '<span class="label">🎭 我演谁：</span>';
      d.chars.forEach(function (c) {
        var btn = document.createElement('button');
        btn.className = 'role';
        btn.setAttribute('data-name', c.name);
        btn.style.background = c.color;
        btn.innerHTML = '<span class="re">' + c.emoji + '</span>' + c.name;
        btn.addEventListener('click', function () {
          state.role = (state.role === c.name) ? null : c.name;
          renderRoles(d);
          applyRole(d);
          beep(620, 0.08);
        });
        rb.appendChild(btn);
      });

      $('patternBox').innerHTML = '<div class="k">核心句型 KEY PATTERN</div>' +
        '<div class="v">' + d.pattern.en + '</div><div class="d">' + d.pattern.zh + '</div>';
      $('tipBox').innerHTML = '💡 ' + d.tip;

      var sc = $('script');
      sc.innerHTML = '';
      d.lines.forEach(function (ln) {
        var ch = charOf(d, ln.who);
        var wrap = document.createElement('div');
        wrap.className = 'line';
        wrap.setAttribute('data-who', ln.who);
        wrap.innerHTML =
          '<span class="avatar" style="background:' + ch.c.color + '">' + ch.c.emoji + '</span>' +
          '<div class="bubble" style="--lc:' + ch.c.color + '">' +
            '<div class="who">' + ln.who + '<span class="you" style="display:none">你</span></div>' +
            '<div class="en"><span class="txt">' + ln.en + '</span><button class="mini-say" title="听这句">🔊</button></div>' +
            '<div class="zh">' + ln.zh + '</div>' +
          '</div>';
        wrap.querySelector('.bubble').style.setProperty('--lc', ch.c.color);
        wrap.querySelector('.mini-say').addEventListener('click', function (ev) {
          ev.stopPropagation();
          speakLine(ln.en, ch.i, 0.78);
        });
        wrap.querySelector('.bubble').addEventListener('click', function () {
          speakLine(ln.en, ch.i, 0.78);
        });
        sc.appendChild(wrap);
      });

      renderRoles(d);
      showScreen('screen-play');
      window.scrollTo({ top: 0 });
    }

    function renderRoles(d) {
      var btns = $('roleBar').querySelectorAll('.role');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('on', btns[i].getAttribute('data-name') === state.role);
      }
    }

    function applyRole(d) {
      var lines = $('script').querySelectorAll('.line');
      for (var i = 0; i < lines.length; i++) {
        var isMine = state.role && lines[i].getAttribute('data-who') === state.role;
        lines[i].classList.toggle('mine', !!isMine);
        var badge = lines[i].querySelector('.you');
        badge.style.display = isMine ? 'inline-block' : 'none';
      }
    }

    /* ---- autoplay ---- */
    var playTimer = null;
    function stopPlaying() {
      state.playing = false;
      if (playTimer) { clearTimeout(playTimer); playTimer = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      var cur = $('script').querySelector('.line.playing');
      if (cur) cur.classList.remove('playing');
      var b = $('playBtn');
      if (b) { b.textContent = '🎬 播放整场'; b.classList.add('play'); }
    }
    function playAll() {
      if (state.playing) { stopPlaying(); return; }
      var d = find(state.id); if (!d) return;
      loadVoices();
      state.playing = true;
      $('playBtn').textContent = '⏸ 暂停';
      $('playBtn').classList.remove('play');
      var lines = $('script').querySelectorAll('.line');
      var i = 0;
      function step() {
        if (!state.playing) return;
        if (i >= d.lines.length) { stopPlaying(); return; }
        for (var k = 0; k < lines.length; k++) lines[k].classList.remove('playing');
        var node = lines[i];
        node.classList.add('playing');
        node.scrollIntoView({ block: 'center', behavior: 'smooth' });
        var ln = d.lines[i];
        var ch = charOf(d, ln.who);
        i++;
        speakLine(ln.en, ch.i, 0.8, function () {
          if (!state.playing) return;
          playTimer = setTimeout(step, 400);
        });
      }
      step();
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      $(id).classList.add('active');
    }
    function step(delta) {
      var i = idxOf(state.id) + delta;
      if (i < 0) i = D.length - 1;
      if (i >= D.length) i = 0;
      open(D[i].id);
    }

    /* ---- events ---- */
    $('filters').addEventListener('click', function (e) {
      var t = e.target.closest('.filter');
      if (!t) return;
      state.lv = parseInt(t.getAttribute('data-lv'), 10);
      document.querySelectorAll('.filter').forEach(function (f) { f.classList.remove('on'); });
      t.classList.add('on');
      renderList();
    });
    $('backList').addEventListener('click', function () { stopPlaying(); showScreen('screen-list'); });
    $('playBtn').addEventListener('click', playAll);
    $('stopBtn').addEventListener('click', stopPlaying);
    $('zhBtn').addEventListener('click', function () {
      state.zh = !state.zh;
      document.querySelectorAll('.bubble .zh').forEach(function (z) { z.classList.toggle('show', state.zh); });
      this.className = 'tool' + (state.zh ? ' on' : '');
      this.textContent = state.zh ? '🀄 隐藏中文' : '🀄 显示中文';
    });
    $('doneBtn').addEventListener('click', function () {
      markPlayed(state.id);
      beep(660, 0.12); beep(880, 0.2, 'sine', 0.14);
      stopPlaying();
      step(1);
    });
    $('nextBtn').addEventListener('click', function () { stopPlaying(); step(1); });
    $('prevBtn').addEventListener('click', function () { stopPlaying(); step(-1); });
    $('soundToggle').addEventListener('click', function () {
      state.soundOn = !state.soundOn;
      this.textContent = state.soundOn ? '🔔' : '🔕';
      if (!state.soundOn) stopPlaying();
    });

    renderList();
  })();
  </script>
</body>
</html>
