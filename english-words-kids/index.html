        'because|/bɪˈkɒz/|因为|',
        'very|/ˈveri/|非常|',
        'too|/tuː/|也；太|',
        'also|/ˈɔːlsəʊ/|也|',
        'again|/əˈɡen/|再一次|',
        'here|/hɪə/|这里|',
        'there|/ðeə/|那里|',
        'now|/naʊ/|现在|',
        'then|/ðen/|然后|',
        'please|/pliːz/|请|🙏',
        'thank you|/θæŋk juː/|谢谢你|🙌',
        'sorry|/ˈsɒri/|对不起|🙇',
        'hello|/həˈləʊ/|你好|👋',
        'goodbye|/ˌɡʊdˈbaɪ/|再见|',
        'yes|/jes/|是|✅',
        'no|/nəʊ/|不|❌'
      ].join('\n')]
    };

    /* ================= Parse ================= */
    function parseWords(str) {
      return str.split('\n').filter(function (line) { return line.trim(); }).map(function (line) {
        var p = line.split('|');
        return { w: p[0].trim(), ipa: p[1].trim(), zh: p[2].trim(), e: (p[3] || '').trim() };
      });
    }

    var DATA = {}, ALL = [], seen = {};
    Object.keys(RAW).forEach(function (key) {
      var r = RAW[key];
      var words = parseWords(r[4]);
      DATA[key] = { n: r[0], en: r[1], icon: r[2], c: r[3], words: words };
      words.forEach(function (w) {
        if (!seen[w.w]) { seen[w.w] = 1; ALL.push(w); }
      });
    });
    DATA.mix = { n: '综合挑战', en: 'Challenge', icon: '🌈', c: '#7C6BFF', words: ALL, mix: true };

    var CAT_KEYS = Object.keys(RAW);
    var TOTAL_WORDS = ALL.length;

    /* ================= State ================= */
    var state = {
      current: null,
      quiz: { qIndex: 0, score: 0, questions: [], locked: false },
      soundOn: true
    };

    /* ================= Helpers ================= */
    function $(id) { return document.getElementById(id); }
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function sample(arr, n) { return shuffle(arr).slice(0, n); }

    function getProgress() {
      try { return JSON.parse(localStorage.getItem('ekw_progress') || '{}'); }
      catch (e) { return {}; }
    }
    function setStars(catId, stars) {
      var p = getProgress();
      if (!p[catId] || p[catId] < stars) p[catId] = stars;
      localStorage.setItem('ekw_progress', JSON.stringify(p));
      renderStars();
    }
    function renderStars() {
      var p = getProgress(), total = 0;
      Object.keys(p).forEach(function (k) { total += p[k]; });
      $('totalStars').textContent = total;
      document.querySelectorAll('.cat-card').forEach(function (card) {
        var id = card.getAttribute('data-id');
        var s = p[id] || 0;
        card.querySelector('.stars').textContent = s > 0 ? '⭐'.repeat(s) : '✨ 待挑战';
      });
    }

    /* ================= Audio ================= */
    var audioCtx = null;
    function beep(freq, dur, type, when) {
      if (!state.soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = type || 'sine'; o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        var t = audioCtx.currentTime + (when || 0);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t); o.stop(t + dur);
      } catch (e) {}
    }
    function sndCorrect() { beep(523, 0.15); beep(659, 0.15, 'sine', 0.12); beep(784, 0.25, 'sine', 0.24); }
    function sndWrong() { beep(220, 0.25, 'square'); beep(180, 0.3, 'square', 0.15); }
    function sndWin() { [523, 587, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.22, 'sine', i * 0.13); }); }

    function speak(text, rate) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate || 0.8;
        u.pitch = 1.1;
        var voices = window.speechSynthesis.getVoices();
        for (var i = 0; i < voices.length; i++) {
          if (/en(-|_)US/i.test(voices[i].lang)) { u.voice = voices[i]; break; }
        }
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }

    /* ================= Confetti ================= */
    var CONF_COLORS = ['#FF6B6B', '#4ECDC4', '#FFD166', '#845EC2', '#5B8DEF', '#FF5E9C', '#3EC97E'];
    function confetti(n) {
      n = n || 40;
      for (var i = 0; i < n; i++) {
        var c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)];
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = (8 + Math.random() * 10) + 'px';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(c);
        (function (el) { setTimeout(function () { el.remove(); }, 4500); })(c);
      }
    }

    /* ================= Screens ================= */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      $(id).classList.add('active');
      window.scrollTo({ top: 0 });
    }

    /* ================= Home ================= */
    function renderHome() {
      $('wordTotal').textContent = TOTAL_WORDS;
      var grid = $('catGrid');
      grid.innerHTML = '';
      var keys = CAT_KEYS.concat(['mix']);
      keys.forEach(function (id) {
        var cat = DATA[id];
        var btn = document.createElement('button');
        btn.className = 'cat-card' + (cat.mix ? ' challenge' : '');
        btn.setAttribute('data-id', id);
        btn.style.setProperty('--cc', cat.c);
        if (cat.mix) {
          btn.innerHTML =
            '<span class="emoji">' + cat.icon + '</span>' +
            '<div><div class="name">' + cat.n + '</div>' +
            '<div class="en">从全部 ' + TOTAL_WORDS + ' 个单词中随机出题</div>' +
            '<div class="stars"></div></div>' +
            '<span class="arrow">▶</span>';
        } else {
          btn.innerHTML =
            '<span class="emoji">' + cat.icon + '</span>' +
            '<div class="name">' + cat.n + '</div>' +
            '<div class="en">' + cat.en + '</div>' +
            '<div class="count">' + cat.words.length + ' 词</div>' +
            '<div class="stars"></div>';
        }
        btn.addEventListener('click', function () {
          beep(660, 0.1);
          state.current = id;
          if (cat.mix) { startQuiz(); }
          else { openLearn(id); }
        });
        grid.appendChild(btn);
      });
      renderStars();
    }

    /* ================= Learn ================= */
    function openLearn(catId) {
      var cat = DATA[catId];
      $('learnTitle').innerHTML = cat.icon + ' ' + cat.n + ' ' + cat.en +
        '<span class="wcount">' + cat.words.length + ' 词</span>' +
        '<small>点 🔊 听发音，翻面会自动朗读</small>';
      var grid = $('cardsGrid');
      grid.innerHTML = '';
      cat.words.forEach(function (word) {
        var card = document.createElement('div');
        card.className = 'wcard';
        card.innerHTML =
          '<div class="wcard-inner">' +
            '<div class="wface front">' +
              '<button class="say-mini" title="听发音">🔊</button>' +
              (word.e ? '<span class="emoji">' + word.e + '</span>' : '<span class="letter">' + word.w.charAt(0).toUpperCase() + '</span>') +
              '<div class="word">' + word.w + '</div>' +
              '<div class="hint">点击翻面 👆</div>' +
            '</div>' +
            '<div class="wface back">' +
              '<div class="word">' + word.w + '</div>' +
              '<div class="ipa">' + word.ipa + '</div>' +
              '<div class="zh">' + word.zh + '</div>' +
              '<button class="say-btn" title="听发音">🔊</button>' +
            '</div>' +
          '</div>';
        card.addEventListener('click', function () {
          card.classList.toggle('flipped');
          beep(520, 0.08);
          if (card.classList.contains('flipped')) speak(word.w);
        });
        card.querySelector('.say-mini').addEventListener('click', function (ev) {
          ev.stopPropagation();
          speak(word.w);
        });
        card.querySelector('.say-btn').addEventListener('click', function (ev) {
          ev.stopPropagation();
          speak(word.w);
        });
        grid.appendChild(card);
      });
      showScreen('screen-learn');
    }

    /* ================= Quiz ================= */
    var QTYPES = ['word2zh', 'emoji2word', 'listen2word'];
    var QTYPE_LABEL = { word2zh: '👀 看词选意思', emoji2word: '🖼️ 看图选单词', listen2word: '👂 听音选单词' };

    function buildQuestions(cat, count) {
      var qs = [];
      var pool = sample(cat.words, Math.min(count, cat.words.length));
      pool.forEach(function (word, i) {
        var type = QTYPES[i % QTYPES.length];
        if (type === 'emoji2word' && !word.e) type = 'word2zh';
        var others = sample(cat.words.filter(function (x) {
          return x.w !== word.w && x.zh !== word.zh;
        }), 3);
        var options = shuffle(others.concat([word]));
        qs.push({ word: word, type: type, options: options });
      });
      return shuffle(qs);
    }

    function startQuiz() {
      var cat = DATA[state.current];
      var count = cat.mix ? 10 : 8;
      $('quizTitle').innerHTML = (cat.mix ? '🌈 ' : '✏️ ') + cat.n +
        '<small>' + (cat.mix ? '全部单词随机出题，共 10 题' : '答对题目，收集星星吧！') + '</small>';
      state.quiz = { qIndex: 0, score: 0, questions: buildQuestions(cat, count), locked: false };
      $('quizBody').style.display = '';
      $('quizResult').style.display = 'none';
      showScreen('screen-quiz');
      renderQuestion();
    }

    function renderQuestion() {
      var q = state.quiz.questions[state.quiz.qIndex];
      state.quiz.locked = false;

      $('qCount').textContent = (state.quiz.qIndex + 1) + ' / ' + state.quiz.questions.length;
      $('pbarFill').style.width = (state.quiz.qIndex / state.quiz.questions.length * 100) + '%';
      $('qType').textContent = QTYPE_LABEL[q.type];
      $('qFeedback').textContent = '';
      $('qFeedback').className = 'q-feedback';

      var prompt = $('qPrompt');
      prompt.innerHTML = '';
      if (q.type === 'word2zh') {
        prompt.innerHTML = '<div class="q-word">' + q.word.w + ' <button class="q-say-mini" title="听发音">🔊</button></div><div class="q-sub">这个词是什么意思呀？</div>';
        prompt.querySelector('.q-say-mini').addEventListener('click', function () { speak(q.word.w); });
      } else if (q.type === 'emoji2word') {
        prompt.innerHTML = '<div class="q-big-emoji">' + q.word.e + '</div><div class="q-sub">图片用英语怎么说？</div>';
      } else {
        prompt.innerHTML = '<div class="q-sub">仔细听，是哪个单词呢？</div><button class="q-listen-btn" id="qListen">🔊</button>';
        setTimeout(function () { speak(q.word.w); }, 350);
        prompt.querySelector('#qListen').addEventListener('click', function () { speak(q.word.w); });
      }

      var optsBox = $('qOpts');
      optsBox.innerHTML = '';
      q.options.forEach(function (opt) {
        var isTarget = opt.w === q.word.w;
        var label;
        if (q.type === 'word2zh') {
          label = (opt.e ? '<span class="opt-emoji">' + opt.e + '</span>' : '') + opt.zh;
        } else {
          label = opt.w;
        }
        var b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = label;
        b.addEventListener('click', function () { answer(b, isTarget, q); });
        optsBox.appendChild(b);
      });
    }

    function answer(btn, isTarget, q) {
      if (state.quiz.locked) return;
      state.quiz.locked = true;
      var buttons = Array.prototype.slice.call($('qOpts').children);
      buttons.forEach(function (b) { b.disabled = true; });

      var fb = $('qFeedback');
      if (isTarget) {
        btn.classList.add('correct');
        state.quiz.score++;
        fb.textContent = pick(['答对啦！你真棒！🌟', '太厉害了！✨', '完全正确！🎉', '好样的！💪']);
        fb.className = 'q-feedback good';
        sndCorrect();
        confetti(24);
      } else {
        btn.classList.add('wrong');
        var correctIndex = q.options.indexOf(q.word);
        if (correctIndex > -1 && buttons[correctIndex]) buttons[correctIndex].classList.add('correct');
        fb.textContent = '正确答案是「' + (q.type === 'word2zh' ? q.word.zh : q.word.w) + '」' +
          (q.type === 'word2zh' ? ' → ' + q.word.w : '') + '，再想想哦～';
        fb.className = 'q-feedback bad';
        sndWrong();
        speak(q.word.w);
      }

      setTimeout(function () {
        state.quiz.qIndex++;
        if (state.quiz.qIndex >= state.quiz.questions.length) showResult();
        else renderQuestion();
      }, 1400);
    }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function showResult() {
      var qz = state.quiz;
      var total = qz.questions.length;
      var ratio = qz.score / total;
      var stars = ratio === 1 ? 3 : ratio >= 0.75 ? 2 : ratio >= 0.5 ? 1 : 0;
      setStars(state.current, stars);

      $('quizBody').style.display = 'none';
      $('quizResult').style.display = '';
      $('resEmoji').textContent = stars === 3 ? '🏆' : stars === 2 ? '🎉' : stars === 1 ? '😊' : '🌱';
      $('resTitle').textContent = stars === 3 ? '满分！你就是单词小达人！' : stars === 2 ? '表现很棒，继续加油！' : stars === 1 ? '不错哦，再练练会更好！' : '没关系，多学多练你最棒！';
      $('resScore').textContent = '答对 ' + qz.score + ' / ' + total + ' 题' + (stars > 0 ? '，获得 ⭐×' + stars : '');
      var starHtml = '';
      for (var i = 0; i < 3; i++) starHtml += i < stars ? '⭐' : '<span class="dim">⭐</span>';
      $('resStars').innerHTML = starHtml;
      if (stars > 0) { sndWin(); confetti(stars === 3 ? 120 : 60); }
    }

    /* ================= Events ================= */
    $('backHome1').addEventListener('click', function () { showScreen('screen-home'); });
    $('backHome2').addEventListener('click', function () { showScreen('screen-home'); });
    $('backHome3').addEventListener('click', function () { showScreen('screen-home'); });
    $('goQuiz').addEventListener('click', startQuiz);
    $('againBtn').addEventListener('click', startQuiz);
    $('soundToggle').addEventListener('click', function () {
      state.soundOn = !state.soundOn;
      this.textContent = state.soundOn ? '🔔' : '🔕';
      if (!state.soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    renderHome();
  })();
  </script>
</body>
</html>
