  <style>
    @font-face { font-family: 'Outfit'; src: url('./_shared/fonts/Outfit-Regular.ttf') format('truetype'); font-weight: 400; }

    .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.3; pointer-events: none; z-index: 0; }

    .wrap { position: relative; z-index: 1; max-width: var(--max); margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    header.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 1.2rem; margin-bottom: 1.4rem; background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); border: 2px solid var(--rule); border-radius: 20px; box-shadow: 0 6px 0 rgba(93,78,178,0.08); }
    .brand { display: flex; align-items: center; gap: 0.7rem; font-weight: 700; font-size: 1.15rem; color: inherit; text-decoration: none; }

    .sound-toggle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rule); background: var(--bg2); font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 rgba(93,78,178,0.1); }

    .hero { text-align: center; margin-bottom: 1.2rem; }

    .pcard .lv { margin-left: auto; font-size: 0.68rem; font-weight: 700; color: #a06a00; background: rgba(255,209,102,0.35); padding: 0.1rem 0.45rem; border-radius: 999px; }
    .pcard .t { font-weight: 700; font-size: 1rem; line-height: 1.3; }

    .pcard .done { color: var(--green); font-weight: 700; }
    .pcard.read { border-color: rgba(62,201,126,0.45); }

    /* reader */
    .mode-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { border: none; cursor: pointer; font-family: inherit; font-weight: 700; border-radius: 13px; padding: 0.6rem 1.15rem; font-size: 0.95rem; background: var(--ink); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.18); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
    .btn.ghost { background: var(--bg2); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 4px 0 rgba(93,78,178,0.12); }
    .btn.teal { background: linear-gradient(135deg, var(--accent2), #2BB3A3); box-shadow: 0 4px 0 rgba(20,130,120,0.35); }
    .btn.purple { background: linear-gradient(135deg, var(--purple), #6E4AB8); box-shadow: 0 4px 0 rgba(90,60,160,0.35); }

    .rtitle { font-size: 1.45rem; font-weight: 700; line-height: 1.3; }

    .toolbar { display: flex; gap: 0.55rem; flex-wrap: wrap; margin: 1rem 0; }

      font-family: inherit; cursor: pointer; font-weight: 700; font-size: 0.88rem;
      border: 2px solid var(--rule); background: var(--bg2); color: var(--ink);
      border-radius: 12px; padding: 0.5rem 0.9rem; box-shadow: 0 3px 0 rgba(93,78,178,0.12);

    .tool:active { transform: translateY(2px); box-shadow: none; }

    .tool.play { background: linear-gradient(135deg, var(--blue), #7aa7f5); color: #fff; border-color: transparent; box-shadow: 0 3px 0 rgba(50,90,170,0.35); }

    .paper { background: rgba(255,255,255,0.92); border: 2px solid var(--rule); border-radius: 22px; padding: 1.5rem 1.4rem; box-shadow: 0 6px 0 rgba(93,78,178,0.08); }
    .en-text { font-size: 1.14rem; line-height: 2; letter-spacing: 0.01em; }
    .en-text.is-reading { color: var(--ink); }
    .zh-box { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--rule); color: #5d5880; font-size: 1rem; line-height: 1.9; }
    .zh-box.show { display: block; }

    .words-box { margin-top: 1.2rem; }
    .words-box h3 { font-size: 0.85rem; color: var(--muted); font-weight: 700; margin-bottom: 0.5rem; letter-spacing: 0.04em; }
    .wchips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .wchip {
      font-family: inherit; cursor: pointer; border: 2px solid rgba(91,141,239,0.3);
      background: rgba(91,141,239,0.08); color: var(--ink); border-radius: 999px;
      padding: 0.32rem 0.75rem; font-size: 0.85rem;
    }
    .wchip b { color: var(--blue); font-weight: 700; }
    .wchip:active { transform: translateY(1px); }

    .quizbox { margin-top: 1.3rem; border-radius: 18px; padding: 1.1rem 1.2rem; background: rgba(255,209,102,0.16); border: 2px dashed rgba(249,168,38,0.35); }
    .quizbox h3 { font-size: 0.92rem; margin-bottom: 0.3rem; }
    .quizbox .ask { font-weight: 700; font-size: 1.02rem; }
    .quizbox .askzh { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }
    .qopts { display: grid; gap: 0.5rem; margin-top: 0.8rem; }
    .qopt {
      font-family: inherit; text-align: left; cursor: pointer; font-size: 0.95rem; font-weight: 600;
      background: var(--bg2); color: var(--ink); border: 2px solid var(--rule);
      border-radius: 12px; padding: 0.6rem 0.85rem;
    }
    .qopt:active { transform: translateY(2px); }
    .qopt.correct { background: #E7F9EE; border-color: var(--green); color: #1c7c47; }
    .qopt.wrong { background: #FDECEC; border-color: var(--accent); color: #c0392b; }
    .qfb { margin-top: 0.7rem; font-weight: 700; font-size: 0.95rem; min-height: 1.4em; }
    .qfb.good { color: var(--green); }
    .qfb.bad { color: #e05656; }

    .reader-foot { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; margin-top: 1.3rem; }
    .navline { display: flex; justify-content: space-between; gap: 0.7rem; margin-top: 1rem; }

    .empty { text-align: center; color: var(--muted); padding: 2rem; }
    footer.credit { text-align: center; margin-top: 2.2rem; color: var(--muted); font-size: 0.78rem; }

    @media (max-width: 620px) {
      .list { grid-template-columns: 1fr; }
      .hero h1 { font-size: 1.3rem; }
      .rtitle { font-size: 1.2rem; }
      .en-text { font-size: 1.05rem; line-height: 1.9; }
      .paper { padding: 1.15rem 1rem; }
      .brand small { display: none; }
    }
  </style>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./">
        <span class="logo">🐻</span>
        <div>英语短文阅读<small>English Reading · 50 篇</small></div>
      </a>
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <div class="chip" title="已读篇数">📖 <span id="readCount">0</span>/50</div>
        <button class="sound-toggle" id="soundToggle" title="开关声音">🔔</button>
      </div>
    </header>

    <!-- List -->
    <section class="screen active" id="screen-list">
      <div class="hero">
        <h1>每天读一篇，英语更厉害！🌻</h1>
        <p>点开一篇，可以听朗读、看中文、做小测验</p>
      </div>
      <div class="filters" id="filters">
        <button class="filter on" data-lv="0">全部 50</button>
        <button class="filter" data-lv="1">⭐ 一级 入门</button>
        <button class="filter" data-lv="2">⭐⭐ 二级 进阶</button>
        <button class="filter" data-lv="3">⭐⭐⭐ 三级 挑战</button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <!-- Reader -->
    <section class="screen" id="screen-read">
      <div class="mode-head">
        <button class="btn ghost" id="backList">← 返回目录</button>
        <div class="rtitle" id="rTitle"></div>
        <button class="btn ghost" id="nextBtn">下一篇 →</button>
      </div>

      <div class="toolbar">
        <button class="tool play" id="playBtn">🔊 朗读全文</button>
        <button class="tool" id="slowBtn">🐢 慢速</button>
        <button class="tool" id="stopBtn">⏹ 停止</button>
        <button class="tool" id="zhBtn">🀄 显示中文</button>
      </div>

      <div class="paper">
        <div class="en-text" id="enText"></div>
        <div class="zh-box" id="zhBox"></div>
        <div class="words-box">
          <h3>重点词 Key Words（点一下听发音）</h3>
          <div class="wchips" id="wChips"></div>
        </div>
      </div>

      <div class="quizbox">
        <h3>🧠 读后小测</h3>
        <div class="ask" id="qAsk"></div>
        <div class="askzh" id="qAskZh"></div>
        <div class="qopts" id="qOpts"></div>
        <div class="qfb" id="qFb"></div>
      </div>

      <div class="reader-foot">
        <button class="btn teal" id="doneBtn">✅ 我读完了</button>
        <button class="btn purple" id="prevBtn">← 上一篇</button>
      </div>
    </section>

    <footer class="credit">朗读使用浏览器英语语音 🔊 · 建议每天读一篇，读出声更好哦</footer>
  </div>

  <script src="./assets/passages.js"></script>
  <script>
  (function () {
    'use strict';
    var P = window.PASSAGES || [];
    var state = { lv: 0, id: 1, soundOn: true, zh: false };

    function $(id) { return document.getElementById(id); }
    function getRead() {
      try { return JSON.parse(localStorage.getItem('ekr_read') || '[]'); } catch (e) { return []; }
    }
    function markRead(id) {
      var arr = getRead();
      if (arr.indexOf(id) === -1) { arr.push(id); localStorage.setItem('ekr_read', JSON.stringify(arr)); }
      $('readCount').textContent = arr.length;
      renderList();
    }
    function find(id) {
      for (var i = 0; i < P.length; i++) if (P[i].id === id) return P[i];
      return null;
    }
    function idxOf(id) {
      for (var i = 0; i < P.length; i++) if (P[i].id === id) return i;
      return 0;
    }

    /* ---- audio ---- */
    var actx = null;
    function beep(f, d, t) {
      if (!state.soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = t || 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(actx.destination);
        var now = actx.currentTime;
        g.gain.setValueAtTime(0.16, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + d);
        o.start(now); o.stop(now + d);
      } catch (e) {}
    }
    function speak(text, rate) {
      if (!state.soundOn || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = rate || 0.85; u.pitch = 1.05;
        var vs = window.speechSynthesis.getVoices();
        for (var i = 0; i < vs.length; i++) if (/en(-|_)US/i.test(vs[i].lang)) { u.voice = vs[i]; break; }
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }

    /* ---- list ---- */
    function renderList() {
      var list = $('list');
      var read = getRead();
      var items = P.filter(function (p) { return state.lv === 0 || p.level === state.lv; });
      list.innerHTML = '';
      if (!items.length) { list.innerHTML = '<div class="empty">这个级别还没有短文哦</div>'; return; }
      items.forEach(function (p) {
        var b = document.createElement('button');
        b.className = 'pcard' + (read.indexOf(p.id) > -1 ? ' read' : '');
        var n = p.text.trim().split(/\s+/).length;
        b.innerHTML =
          '<div class="top"><span class="icon">' + p.icon + '</span>' +
          '<span class="num">No.' + p.id + '</span>' +
          '<span class="lv">' + '⭐'.repeat(p.level) + '</span></div>' +
          '<div class="t">' + p.title + '</div>' +
          '<div class="tz">' + p.titleZh + '</div>' +
          '<div class="meta"><span>' + n + ' words</span>' +
          (read.indexOf(p.id) > -1 ? '<span class="done">✓ 已读</span>' : '') +
          '</div>';
        b.addEventListener('click', function () { beep(660, 0.09); open(p.id); });
        list.appendChild(b);
      });
      $('readCount').textContent = read.length;
    }

    /* ---- reader ---- */
    function open(id) {
      var p = find(id);
      if (!p) return;
      state.id = id;
      state.zh = false;
      $('zhBox').className = 'zh-box';
      $('zhBtn').className = 'tool';
      $('zhBtn').textContent = '🀄 显示中文';

      $('enText').textContent = p.text;
      $('zhBox').textContent = p.zh;
      $('rTitle').innerHTML = p.title + '<small>' + p.titleZh + ' · ' + '⭐'.repeat(p.level) + ' · ' + p.text.trim().split(/\s+/).length + ' 词</small>';

      var box = $('wChips');
      box.innerHTML = '';
      p.words.forEach(function (w) {
        var c = document.createElement('button');
        c.className = 'wchip';
        c.innerHTML = '<b>' + w[0] + '</b> ' + w[1] + ' 🔊';
        c.addEventListener('click', function () { speak(w[0], 0.75); });
        box.appendChild(c);
      });

      $('qAsk').textContent = p.q.ask;
      $('qAskZh').textContent = p.q.askZh;
      $('qFb').textContent = '';
      $('qFb').className = 'qfb';
      var ob = $('qOpts');
      ob.innerHTML = '';
      p.q.opts.forEach(function (opt, i) {
        var b = document.createElement('button');
        b.className = 'qopt';
        b.textContent = opt;
        b.addEventListener('click', function () { answerQuiz(b, i, p); });
        ob.appendChild(b);
      });

      showScreen('screen-read');
      window.scrollTo({ top: 0 });
    }

    function answerQuiz(btn, i, p) {
      var kids = $('qOpts').children;
      for (var k = 0; k < kids.length; k++) kids[k].disabled = true;
      if (i === p.q.a) {
        btn.classList.add('correct');
        $('qFb').textContent = '答对啦！读得真仔细 🌟';
        $('qFb').className = 'qfb good';
        beep(523, 0.15); beep(659, 0.15, 'sine', 0.12 + 0); beep(784, 0.22, 'sine', 0.24);
      } else {
        btn.classList.add('wrong');
        if (kids[p.q.a]) kids[p.q.a].classList.add('correct');
        $('qFb').textContent = '再读一读，答案就在短文里哦～';
        $('qFb').className = 'qfb bad';
        beep(220, 0.2, 'square');
      }
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      $(id).classList.add('active');
    }

    function step(delta) {
      var i = idxOf(state.id) + delta;
      if (i < 0) i = P.length - 1;
      if (i >= P.length) i = 0;
      open(P[i].id);
    }

    /* ---- events ---- */
    $('filters').addEventListener('click', function (e) {
      var t = e.target.closest('.filter');
      if (!t) return;
      state.lv = parseInt(t.getAttribute('data-lv'), 10);
      document.querySelectorAll('.filter').forEach(function (f) { f.classList.remove('on'); });
      t.classList.add('on');
      renderList();
    });
    $('backList').addEventListener('click', function () { window.speechSynthesis && window.speechSynthesis.cancel(); showScreen('screen-list'); });
    $('playBtn').addEventListener('click', function () {
      var p = find(state.id); if (p) speak(p.text, 0.85);
    });
    $('slowBtn').addEventListener('click', function () {
      var p = find(state.id); if (p) speak(p.text, 0.65);
      this.classList.add('on');
      var self = this;
      setTimeout(function () { self.classList.remove('on'); }, 600);
    });
    $('stopBtn').addEventListener('click', function () { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); });
    $('zhBtn').addEventListener('click', function () {
      state.zh = !state.zh;
      $('zhBox').className = 'zh-box' + (state.zh ? ' show' : '');
      this.className = 'tool' + (state.zh ? ' on' : '');
      this.textContent = state.zh ? '🀄 隐藏中文' : '🀄 显示中文';
    });
    $('doneBtn').addEventListener('click', function () {
      markRead(state.id);
      beep(660, 0.12); beep(880, 0.2, 'sine', 0.15);
      step(1);
    });
    $('nextBtn').addEventListener('click', function () { step(1); });
    $('prevBtn').addEventListener('click', function () { step(-1); });
    $('soundToggle').addEventListener('click', function () {
      state.soundOn = !state.soundOn;
      this.textContent = state.soundOn ? '🔔' : '🔕';
      if (!state.soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    renderList();
  })();
  </script>
</body>
</html>
